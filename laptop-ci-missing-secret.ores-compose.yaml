schema_version: ores.compose.v1
project: laptop-ci-missing-secret
allow_lazy_start: false
source:
  repository: https://127.0.0.1:1/must-not-connect.git
  commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  checkout_dir: .ores/must-not-connect

services:
  blocked:
    name: blocked
    runtime: host
    inherit_env: [PATH, PROBE_OUTPUT_DIR]
    secret_env:
      REQUIRED_SECRET: INTENTIONALLY_MISSING_SECRET
    command: ["bash", "-lc", "touch \"$PROBE_OUTPUT_DIR/process-side-effect\"; sleep 60"]
    build:
      - ["bash", "-lc", "touch \"$PROBE_OUTPUT_DIR/build-side-effect\""]
    working_dir: .
    replicas: 1
