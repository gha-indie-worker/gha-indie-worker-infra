schema_version: ores.compose.v1
# ores-compose-nano-id: svaBNfKA08dfDm5-3SU2G
project: gha-indie-worker
allow_lazy_start: false
source:
  repository: https://github.com/gha-indie-worker/gha-indie-worker-monorepo.git
  commit: 68de4b122d06621805bfb810367488bd171272c7
  checkout_dir: .ores/sources/gha-indie-worker-monorepo

# Policy authority for service selection. Port 8080 is intentionally NOT owned
# by this application stack; the shared codespaces-cluster Rust edge owns it.
load_balancer:
  strategy: round-robin
  max_attempts: 2
  failover_on_missing_backend: true
  failover_on_invalid_backend: true

# OCI local infrastructure requires ORESoftware/ores-compose#156.
# Project-root .env supplies ORES_LOCAL_OBJECT_ACCESS_KEY,
# ORES_LOCAL_OBJECT_SECRET_KEY and ORES_LOCAL_MC_HOST.
services:
  redis:
    runtime: auto
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: [{ host: 127.0.0.1, published: 6379, target: 6379 }]
    mounts: [{ type: volume, source: ores-redis-data, target: /data }]

  nats:
    runtime: auto
    image: nats:2.15.0-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - { host: 127.0.0.1, published: 4222, target: 4222 }
      - { host: 127.0.0.1, published: 8222, target: 8222 }
    mounts: [{ type: volume, source: ores-nats-data, target: /data }]

  object-store:
    runtime: auto
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--address", ":9000"]
    environment: { MINIO_ROOT_USER: { from_env: ORES_LOCAL_OBJECT_ACCESS_KEY } }
    secrets: { MINIO_ROOT_PASSWORD: { from_env: ORES_LOCAL_OBJECT_SECRET_KEY } }
    ports: [{ host: 127.0.0.1, published: 9000, target: 9000 }]
    mounts: [{ type: volume, source: ores-object-store-data, target: /data }]

  storage-ready:
    runtime: auto
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    lifecycle: one-shot
    depends_on: [object-store]
    secrets: { MC_HOST_local: { from_env: ORES_LOCAL_MC_HOST } }
    command: ["ready", "local"]

  storage-init:
    runtime: auto
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    lifecycle: one-shot
    depends_on: [storage-ready]
    secrets: { MC_HOST_local: { from_env: ORES_LOCAL_MC_HOST } }
    command: ["mb", "--ignore-existing", "local/s3-local-dummy", "local/r2-local-dummy"]

  api:
    name: api
    runtime: host
    command:
      - env
      - GHA_INDIE_WORKER_API_BIND=127.0.0.1:18090
      - ./target/debug/gha-indie-worker-api-server
    build:
      - ["cargo", "build", "--bin", "gha-indie-worker-api-server"]
    working_dir: apps/gha-indie-worker-api-server.rs
    replicas: 1
    depends_on: [redis, nats, storage-init]
    healthcheck:
      command: ["curl", "--fail", "--silent", "http://127.0.0.1:18090/readyz"]
      interval_ms: 1000
      timeout_ms: 1000
      retries: 20

  web:
    name: web
    runtime: host
    command:
      - env
      - GHA_INDIE_WORKER_WEB_BIND=127.0.0.1:18091
      - GHA_INDIE_WORKER_API_HTTP_BASE=http://127.0.0.1:18090
      - ./target/debug/gha-indie-worker-web-server
    build:
      - ["cargo", "build", "--bin", "gha-indie-worker-web-server"]
    working_dir: apps/gha-indie-worker-web-server.rs
    replicas: 1
    depends_on: [api]
    healthcheck:
      command: ["curl", "--fail", "--silent", "http://127.0.0.1:18091/readyz"]
      interval_ms: 1000
      timeout_ms: 1000
      retries: 20
