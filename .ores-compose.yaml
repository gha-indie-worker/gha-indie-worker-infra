schema_version: ores.compose.v1
project: gha-indie-worker
allow_lazy_start: false
source:
  repository: https://github.com/gha-indie-worker/gha-indie-worker-monorepo.git
  # Exact head of gha-indie-worker-monorepo#9. Keep this pinned; when #9 lands
  # with a different merge SHA, advance this pin explicitly in the same review.
  commit: cb0e8fc278bc826a15f967c1abbc38f82bb7d1d9
  checkout_dir: .ores/sources/gha-indie-worker-monorepo

# Policy authority for service selection. Port 8080 is intentionally NOT owned
# by this application stack; the shared codespaces-cluster Rust edge owns it.
load_balancer:
  strategy: round-robin
  max_attempts: 2
  failover_on_missing_backend: true
  failover_on_invalid_backend: true

services:
  api:
    name: api
    runtime: host
    inherit_env: [PATH, HOME]
    environment:
      GHA_INDIE_WORKER_API_BIND: "127.0.0.1:18090"
    command:
      - ./target/debug/gha-indie-worker-api-server
    build:
      - ["cargo", "build", "--bin", "gha-indie-worker-api-server"]
    working_dir: apps/gha-indie-worker-api-server.rs
    replicas: 1
    healthcheck:
      command: ["curl", "--fail", "--silent", "http://127.0.0.1:18090/readyz"]
      interval_ms: 1000
      timeout_ms: 1000
      retries: 20

  web:
    name: web
    runtime: host
    inherit_env: [PATH, HOME]
    environment:
      GHA_INDIE_WORKER_WEB_BIND: "127.0.0.1:18091"
      GHA_INDIE_WORKER_API_HTTP_BASE: "http://127.0.0.1:18090"
    command:
      - ./target/debug/gha-indie-worker-web-server
    build:
      - ["cargo", "build", "--bin", "gha-indie-worker-web-server"]
    working_dir: apps/gha-indie-worker-web-server.rs
    replicas: 1
    depends_on: [api]
    healthcheck:
      command: ["curl", "--fail", "--silent", "http://127.0.0.1:18091/readyz"]
      interval_ms: 1000
      timeout_ms: 1000
      retries: 20

  # Opportunistic PR CI worker. The binary is built from an immutable split-repo
  # SHA inside its immutable k8s-cluster provenance workspace by the trusted
  # monorepo bootstrap script. PR-authored code never chooses these commands,
  # environment bindings, profile, App identity, push, or deploy authority.
  ci-worker:
    name: ci-worker
    runtime: host
    inherit_env: [PATH, HOME]
    environment:
      HOST: "127.0.0.1"
      PORT: "8100"
      INDIEBUILD_PROVENANCE_COMMIT: "5cfac43c6900898f36f588d044ca34083da1c726"
      INDIEBUILD_WORKER_SHA: "be8f6aac3eb6e1d1f76d613e3082ca2114ceb2bf"
      BUILD_SERVER_REPORTING_MODE: "app-required"
      BUILD_SERVER_CHECK_RUN_NAME: "indiebuild.dev/ci"
      BUILD_SERVER_ADVISORY_STATUS_CONTEXT: "indiebuild.dev/ci-advisory"
      BUILD_SERVER_WEBHOOK_RULES_PATH: "config/ci-worker-webhook-rules.json"
      BUILD_SERVER_ALLOWED_REPO_PREFIXES: "https://github.com/gha-indie-worker/"
      BUILD_SERVER_ALLOWED_PROFILE_REPO_PREFIXES: "https://github.com/gha-indie-worker/"
      BUILD_SERVER_ALLOWED_PROFILES: "rust-verify"
      BUILD_SERVER_DEPLOY_ENABLED: "false"
      BUILD_SERVER_PUSH_ENABLED: "false"
      BUILD_SERVER_ECR_LOGIN_ENABLED: "false"
      BUILD_SERVER_NATS_ENABLED: "false"
      BUILD_SERVER_NATS_INTAKE_ENABLED: "false"
      BUILD_SERVER_COORDINATION_ENABLED: "false"
      BUILD_SERVER_COORDINATION_REQUIRED: "false"
      BUILD_SERVER_GH_SYNC_ENABLED: "false"
      BUILD_SERVER_LAMBDA_ENABLED: "false"
      BUILD_SERVER_KEEP_WORKDIRS: "false"
    secret_env:
      # This non-secret state path intentionally uses the required binding
      # mechanism too: it must be an operator-owned absolute directory OUTSIDE
      # the materialized source checkout so report intents survive refreshes.
      BUILD_SERVER_WORK_ROOT: INDIEBUILD_WORK_ROOT
      BUILD_SERVER_GITHUB_APP_ID: INDIEBUILD_GITHUB_APP_ID
      BUILD_SERVER_GITHUB_APP_PRIVATE_KEY_PATH: INDIEBUILD_GITHUB_APP_PRIVATE_KEY_PATH
      BUILD_SERVER_GITHUB_WEBHOOK_SECRET: INDIEBUILD_GITHUB_WEBHOOK_SECRET
      BUILD_SERVER_AUTH_SECRET: INDIEBUILD_WORKER_AUTH_SECRET
    command:
      - ./.ores/ci-worker-target/debug/dd-build-server
    build:
      - ["bash", "scripts/bootstrap-ci-worker.sh"]
    working_dir: .
    replicas: 1
    healthcheck:
      command: ["curl", "--fail", "--silent", "http://127.0.0.1:8100/readyz"]
      interval_ms: 3000
      timeout_ms: 2000
      retries: 20

  # Remotely managed Cloudflare Tunnel. The token is never written to this
  # manifest or argv; cloudflared natively reads TUNNEL_TOKEN from its isolated
  # service environment. No GitHub/App/webhook/worker secret is mapped here.
  cloudflare-tunnel:
    name: cloudflare-tunnel
    runtime: host
    inherit_env: [PATH]
    secret_env:
      TUNNEL_TOKEN: INDIEBUILD_CLOUDFLARE_TUNNEL_TOKEN
    command:
      - cloudflared
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:18096
      - run
    working_dir: .
    replicas: 1
    depends_on: [ci-worker]
    healthcheck:
      command: ["curl", "--fail", "--silent", "http://127.0.0.1:18096/ready"]
      interval_ms: 3000
      timeout_ms: 2000
      retries: 20
