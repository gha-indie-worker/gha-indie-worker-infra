schema_version: ores.compose.v1
project: gha-indie-worker
allow_lazy_start: false
source:
  repository: https://github.com/gha-indie-worker/gha-indie-worker-monorepo.git
  commit: 68de4b122d06621805bfb810367488bd171272c7
  checkout_dir: .ores/sources/gha-indie-worker-monorepo

# Policy authority for service selection. Port 8080 is intentionally NOT owned
# by this application stack; the shared codespaces-cluster Rust edge owns it.
load_balancer:
  strategy: round-robin
  max_attempts: 2
  failover_on_missing_backend: true
  failover_on_invalid_backend: true

services:
  redis:
    runtime: host
    build:
      - ["mkdir", "-p", "tmp/redis"]
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--appendonly", "yes", "--dir", "tmp/redis"]
    healthcheck:
      command: ["redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping"]
      interval_ms: 1000
      timeout_ms: 500
      retries: 20

  nats:
    runtime: host
    build:
      - ["mkdir", "-p", "tmp/nats"]
    command: ["nats-server", "-js", "-sd", "tmp/nats", "-a", "127.0.0.1", "-p", "4222", "-m", "8222"]
    healthcheck:
      command: ["curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8222/healthz"]
      interval_ms: 1000
      timeout_ms: 500
      retries: 20

  s3-local:
    runtime: host
    build:
      - ["mkdir", "-p", "tmp/minio-s3"]
    command: ["env", "MINIO_ROOT_USER=local_root", "MINIO_ROOT_PASSWORD=local_password", "minio", "server", "tmp/minio-s3", "--address", "127.0.0.1:9000", "--console-address", "127.0.0.1:9001"]
    healthcheck:
      command: ["curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9000/minio/health/live"]
      interval_ms: 1000
      timeout_ms: 500
      retries: 20

  r2-local:
    runtime: host
    build:
      - ["mkdir", "-p", "tmp/minio-r2"]
    command: ["env", "MINIO_ROOT_USER=local_root", "MINIO_ROOT_PASSWORD=local_password", "minio", "server", "tmp/minio-r2", "--address", "127.0.0.1:9100", "--console-address", "127.0.0.1:9101"]
    healthcheck:
      command: ["curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9100/minio/health/live"]
      interval_ms: 1000
      timeout_ms: 500
      retries: 20

  api:
    name: api
    runtime: host
    command:
      - env
      - GHA_INDIE_WORKER_API_BIND=127.0.0.1:18090
      - ./target/debug/gha-indie-worker-api-server
    build:
      - ["cargo", "build", "--bin", "gha-indie-worker-api-server"]
    working_dir: apps/gha-indie-worker-api-server.rs
    replicas: 1
    depends_on: [redis, nats, s3-local, r2-local]
    healthcheck:
      command: ["curl", "--fail", "--silent", "http://127.0.0.1:18090/readyz"]
      interval_ms: 1000
      timeout_ms: 1000
      retries: 20
  web:
    name: web
    runtime: host
    command:
      - env
      - GHA_INDIE_WORKER_WEB_BIND=127.0.0.1:18091
      - GHA_INDIE_WORKER_API_HTTP_BASE=http://127.0.0.1:18090
      - ./target/debug/gha-indie-worker-web-server
    build:
      - ["cargo", "build", "--bin", "gha-indie-worker-web-server"]
    working_dir: apps/gha-indie-worker-web-server.rs
    replicas: 1
    depends_on: [api]
    healthcheck:
      command: ["curl", "--fail", "--silent", "http://127.0.0.1:18091/readyz"]
      interval_ms: 1000
      timeout_ms: 1000
      retries: 20
