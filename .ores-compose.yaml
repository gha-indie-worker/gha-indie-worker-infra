schema_version: ores.compose.v1
project: gha-indie-worker
allow_lazy_start: false

# The infra repository owns the pinned workspace. ores-compose materializes the
# product monorepo below tmp/dev and makes that checkout the execution root, so
# every service working_dir below is relative to the monorepo, not to this repo.
source:
  repository: https://github.com/gha-indie-worker/gha-indie-worker-monorepo
  commit: a3ea379240d3a73ed3ed66ab838368931103754a
  checkout_dir: tmp/dev/gha-indie-worker-monorepo

services:
  api:
    runtime: host
    command:
      - env
      - GHA_INDIE_WORKER_API_BIND=127.0.0.1:18090
      - cargo
      - run
      - --locked
    build:
      - ["cargo", "build", "--locked"]
    working_dir: apps/gha-indie-worker-api-server.rs
    replicas: 1
    healthcheck:
      command: ["curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:18090/healthz"]
      interval_ms: 1000
      timeout_ms: 1000
      retries: 20
  web:
    runtime: host
    command:
      - env
      - GHA_INDIE_WORKER_WEB_BIND=127.0.0.1:18091
      - GHA_INDIE_WORKER_API_HTTP_BASE=http://127.0.0.1:18090
      - cargo
      - run
      - --locked
    build:
      - ["cargo", "build", "--locked"]
    working_dir: apps/gha-indie-worker-web-server.rs
    replicas: 1
    depends_on: [api]
    healthcheck:
      command: ["curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:18091/healthz"]
      interval_ms: 1000
      timeout_ms: 1000
      retries: 20
