apiVersion: v1
kind: Namespace
metadata:
  name: gha-indie-worker-runners
  labels:
    kubernetes.io/metadata.name: gha-indie-worker-runners
    plane: runner
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: runner-budget
  namespace: gha-indie-worker-runners
spec:
  hard:
    pods: "64"
    requests.cpu: "32"
    requests.memory: 64Gi
    limits.cpu: "64"
    limits.memory: 128Gi
    requests.ephemeral-storage: 128Gi
    limits.ephemeral-storage: 256Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: runner-defaults
  namespace: gha-indie-worker-runners
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "250m"
        memory: 512Mi
        ephemeral-storage: 1Gi
      default:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 8Gi
