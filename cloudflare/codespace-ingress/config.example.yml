# Copy outside the repository before use. Never commit the real credentials file.
tunnel: REPLACE_WITH_CODESPACE_TUNNEL_UUID
credentials-file: /workspaces/.cloudflared/REPLACE_WITH_CODESPACE_TUNNEL_UUID.json

originRequest:
  connectTimeout: 5s
  access:
    required: true
    teamName: REPLACE_WITH_ACCESS_TEAM_NAME
    audTag:
      - REPLACE_WITH_CODESPACE_ACCESS_AUD

ingress:
  - hostname: codespace.indiebuild.dev
    service: http://127.0.0.1:8080
  - service: http_status:404
