name: certify ores-clients-core 1

on:
  pull_request:
    paths:
      - '.github/workflows/certify-ores-clients-core-1.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-ore-exact-heads-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUBJECT_SHA: 64d653c2550f9ac3b7fd93e3bb1ad7a9e9834681
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-clients-core
          ref: ${{ env.SUBJECT_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: subject
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source
        run: |
          set -Eeuo pipefail
          test "$(git -C subject rev-parse HEAD)" = "$SUBJECT_SHA"
          test -z "$(git -C subject status --porcelain)"
      - name: Configure private Cargo Git reads
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          gh auth setup-git
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy
      - name: Rust format
        working-directory: subject
        run: cargo fmt --all -- --check
      - name: Rust Clippy
        working-directory: subject
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        working-directory: subject
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test --all-targets --all-features
      - name: Assert source remained immutable
        if: always()
        run: |
          set -Eeuo pipefail
          test "$(git -C subject rev-parse HEAD)" = "$SUBJECT_SHA"
          test -z "$(git -C subject status --porcelain)"
