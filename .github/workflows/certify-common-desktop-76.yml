name: certify common desktop #76

on:
  pull_request:
    paths:
      - '.github/workflows/certify-common-desktop-76.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-common-desktop-76-20260930'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: 2f27ebf4fdbeeb6df842fd73474a395eb697bfaf
      EXPECTED_BASE_SHA: 2c8cadde43d4db52088cba625df3a16485311218
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact claim-read candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-common-desktop-infra
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: common-desktop
          persist-credentials: false
          fetch-depth: 32

      - name: Assert exact focused review surface
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          mapfile -t files < <(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD)
          test "${#files[@]}" -eq 1
          test "${files[0]}" = 'ipc/rust/src/lib.rs'
          grep -F 'opened_metadata.dev() != metadata.dev()' ipc/rust/src/lib.rs
          grep -F 'fn symlink_claim_fails_closed()' ipc/rust/src/lib.rs
          grep -F 'fn permissive_claim_file_fails_closed()' ipc/rust/src/lib.rs

      - name: Configure private Cargo Git reads
        working-directory: common-desktop
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: gh auth setup-git

      - name: Install pinned Rust
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt,clippy
          rustup default 1.82.0
          rustc --version | grep -F 'rustc 1.82.0'

      - name: Classify inherited rustfmt drift
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          git show "$EXPECTED_BASE_SHA:ipc/rust/src/lib.rs" > "${RUNNER_TEMP}/base.rs"
          cp ipc/rust/src/lib.rs "${RUNNER_TEMP}/head.rs"
          base_clean=1
          head_clean=1
          rustfmt --edition 2021 --check "${RUNNER_TEMP}/base.rs" || base_clean=0
          rustfmt --edition 2021 --check "${RUNNER_TEMP}/head.rs" || head_clean=0
          printf 'base_rustfmt_clean=%s\nhead_rustfmt_clean=%s\n' "$base_clean" "$head_clean"
          if test "$base_clean" -eq 1; then
            test "$head_clean" -eq 1
          fi

      - name: Verify workspace lock stays deterministic
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          cp Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"
          cargo generate-lockfile
          cmp -s Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"

      - name: Locked IPC check
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo check --locked -p ores-common-desktop-ipc --all-targets

      - name: Strict IPC Clippy
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo clippy --locked -p ores-common-desktop-ipc --all-targets -- -D warnings -A clippy::needless-return

      - name: Locked IPC tests
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test --locked -p ores-common-desktop-ipc --all-targets

      - name: Restore and assert immutable source checkout
        if: always()
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout -- Cargo.lock || true
          git clean -fd -- target
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
