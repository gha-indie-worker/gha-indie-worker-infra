name: certify codespaces-cluster #12

on:
  pull_request:
    paths:
      - '.github/workflows/certify-codespaces-cluster-12.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-codespaces-cluster-12-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: 5008fa76c31809db5e3b89e9c46c0a983d672b62
      EXPECTED_BASE_SHA: e8cd4fe3a748709e31e0b29d4a3a09ab9f4bfc57
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact codespaces-cluster candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/codespaces-cluster
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: codespaces-cluster
          persist-credentials: false
          fetch-depth: 64

      - name: Assert exact source and review surface
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          test "$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | wc -l | tr -d ' ')" -eq 6
          git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | grep -Fx '.github/workflows/ci.yml'
          git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | grep -Fx 'Justfile'
          git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | grep -Fx 'config/ores-compose.rev'
          git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | grep -Fx 'docs/bootstrap-toolchain.md'
          git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | grep -Fx 'scripts/bootstrap-pinned-cargo-tool.sh'
          git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | grep -Fx 'test/bootstrap-pinned-cargo-tool.sh'
          test ! -e Cargo.lock

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.88'
          components: rustfmt, clippy

      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Bootstrap security regression tests
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/bootstrap-pinned-cargo-tool.sh
          bash -n test/bootstrap-pinned-cargo-tool.sh
          bash test/bootstrap-pinned-cargo-tool.sh

      - name: Worker syntax and unit tests
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check src/index.js
          node --check src/router.js
          node --check scripts/render-wrangler.mjs
          node --check test/router.test.js
          node --check test/render-wrangler.test.js
          node --test

      - name: Generate deterministic lock candidate
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo generate-lockfile
          sha256sum Cargo.lock | tee "${RUNNER_TEMP}/codespaces-cluster-12-cargo-lock.sha256"
          cp Cargo.lock "${RUNNER_TEMP}/codespaces-cluster-12-Cargo.lock"

      - name: Locked Rust verification
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Lifecycle locked-build contract
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'CARGO_TARGET_DIR="$PWD/target" cargo build --locked --quiet --bin codespaces-cluster-ctl' Justfile
          grep -Fq 'repository_receipt="$receipt_dir/$binary.repository"' scripts/bootstrap-pinned-cargo-tool.sh
          grep -Fq 'package_receipt="$receipt_dir/$binary.package"' scripts/bootstrap-pinned-cargo-tool.sh
          grep -Fq 'recorded_repository' scripts/bootstrap-pinned-cargo-tool.sh
          grep -Fq 'recorded_package' scripts/bootstrap-pinned-cargo-tool.sh
          grep -Fq '! -L "$installed_binary"' scripts/bootstrap-pinned-cargo-tool.sh

      - name: Upload resolver-generated lock candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codespaces-cluster-12-lock-${{ env.EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/codespaces-cluster-12-Cargo.lock
            ${{ runner.temp }}/codespaces-cluster-12-cargo-lock.sha256
          if-no-files-found: warn
          retention-days: 7

      - name: Restore candidate and assert source immutability
        if: always()
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f Cargo.lock
          git clean -fd -- target
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
