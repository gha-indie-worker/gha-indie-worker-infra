name: certify codespaces-cluster #12

on:
  pull_request:
    paths:
      - '.github/workflows/certify-codespaces-cluster-12.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-codespaces-cluster-12-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: 72149bd4889a62814ca630f2cbf4d05cf97a620e
      EXPECTED_BASE_SHA: e8cd4fe3a748709e31e0b29d4a3a09ab9f4bfc57
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact codespaces-cluster candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/codespaces-cluster
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: codespaces-cluster
          persist-credentials: false
          fetch-depth: 64
      - name: Assert exact source and review surface
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          test "$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | wc -l | tr -d ' ')" -eq 11
          for path in \
            .github/workflows/ci.yml \
            Cargo.lock \
            Justfile \
            config/ores-compose.rev \
            docs/bootstrap-toolchain.md \
            rust/ctl.rs \
            rust/edge.rs \
            rust/service.rs \
            scripts/bootstrap-pinned-cargo-tool.sh \
            test/bootstrap-pinned-cargo-tool.sh \
            test/bootstrap-receipt-permissions.sh; do
            git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | grep -Fx "$path"
          done
          test -f Cargo.lock
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.88'
          components: rustfmt, clippy
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Bootstrap security regression tests
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/bootstrap-pinned-cargo-tool.sh
          bash -n test/bootstrap-pinned-cargo-tool.sh
          bash -n test/bootstrap-receipt-permissions.sh
          bash test/bootstrap-pinned-cargo-tool.sh
          bash test/bootstrap-receipt-permissions.sh
      - name: Worker syntax and unit tests
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check src/index.js
          node --check src/router.js
          node --check scripts/render-wrangler.mjs
          node --check test/router.test.js
          node --check test/render-wrangler.test.js
          node --test
      - name: Prove committed lock is resolver-stable
        id: lock_stability
        continue-on-error: true
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          cp Cargo.lock "${RUNNER_TEMP}/codespaces-cluster-12-Cargo.lock"
          sha256sum Cargo.lock | tee "${RUNNER_TEMP}/codespaces-cluster-12-cargo-lock.sha256"
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock
      - name: Capture rustfmt patch
        id: rustfmt
        continue-on-error: true
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all
          git diff -- . > "${RUNNER_TEMP}/codespaces-cluster-12-rustfmt.patch"
          git checkout -- .
          test ! -s "${RUNNER_TEMP}/codespaces-cluster-12-rustfmt.patch"
      - name: Upload rustfmt patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codespaces-cluster-12-rustfmt-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/codespaces-cluster-12-rustfmt.patch
          if-no-files-found: ignore
          retention-days: 7
      - name: Locked Rust check
        id: rust_check
        continue-on-error: true
        working-directory: codespaces-cluster
        run: cargo check --locked --all-targets
      - name: Locked strict Clippy
        id: clippy
        continue-on-error: true
        working-directory: codespaces-cluster
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Locked Rust tests
        id: rust_tests
        continue-on-error: true
        working-directory: codespaces-cluster
        run: cargo test --locked --all-targets
      - name: Lifecycle hardening contract
        id: lifecycle_contract
        continue-on-error: true
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'CARGO_TARGET_DIR="$PWD/target" cargo build --locked --quiet --bin codespaces-cluster-ctl' Justfile
          grep -Fq 'cargo check --locked --all-targets' Justfile
          grep -Fq 'cargo clippy --locked --all-targets -- -D warnings' Justfile
          grep -Fq 'cargo test --locked --all-targets' Justfile
          grep -Fq 'bash test/bootstrap-receipt-permissions.sh' Justfile
          grep -Fq 'repository_receipt="$receipt_dir/$binary.repository"' scripts/bootstrap-pinned-cargo-tool.sh
          grep -Fq 'package_receipt="$receipt_dir/$binary.package"' scripts/bootstrap-pinned-cargo-tool.sh
          grep -Fq 'recorded_repository' scripts/bootstrap-pinned-cargo-tool.sh
          grep -Fq 'recorded_package' scripts/bootstrap-pinned-cargo-tool.sh
          grep -Fq '! -L "$installed_binary"' scripts/bootstrap-pinned-cargo-tool.sh
          grep -Fq 'chmod 700 "$receipt_dir"' scripts/bootstrap-pinned-cargo-tool.sh
          grep -Fq 'ensure_private_receipt_file' scripts/bootstrap-pinned-cargo-tool.sh
          local_down="$(grep -A1 '^local-cluster-down:' Justfile)"
          local_status="$(grep -A1 '^local-cluster-status:' Justfile)"
          edge_down="$(grep -A1 '^codespace-edge-down:' Justfile)"
          ! grep -Fq 'cargo build' <<<"$local_down"
          ! grep -Fq 'cargo build' <<<"$local_status"
          ! grep -Fq 'cargo build' <<<"$edge_down"
      - name: Upload committed lock evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codespaces-cluster-12-lock-${{ env.EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/codespaces-cluster-12-Cargo.lock
            ${{ runner.temp }}/codespaces-cluster-12-cargo-lock.sha256
          if-no-files-found: warn
          retention-days: 7
      - name: Require lock stability
        if: always()
        run: test '${{ steps.lock_stability.outcome }}' = success
      - name: Require Rust check
        if: always()
        run: test '${{ steps.rust_check.outcome }}' = success
      - name: Require strict Clippy
        if: always()
        run: test '${{ steps.clippy.outcome }}' = success
      - name: Require Rust tests
        if: always()
        run: test '${{ steps.rust_tests.outcome }}' = success
      - name: Require lifecycle contract
        if: always()
        run: test '${{ steps.lifecycle_contract.outcome }}' = success
      - name: Require formatting
        if: always()
        run: test '${{ steps.rustfmt.outcome }}' = success
      - name: Assert immutable source
        if: always()
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout -- .
          git clean -fd -- target
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
