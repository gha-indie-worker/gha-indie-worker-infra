name: certify codespaces-cluster #12 lock

on:
  push:
    branches:
      - ci/certify-codespaces-cluster-12-lock-20260929
    paths:
      - '.github/workflows/certify-codespaces-cluster-12-lock.yml'
  pull_request:
    paths:
      - '.github/workflows/certify-codespaces-cluster-12-lock.yml'

permissions:
  contents: read

jobs:
  certify:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'ci/certify-codespaces-cluster-12-lock-20260929') ||
      github.head_ref == 'ci/certify-codespaces-cluster-12-lock-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CODESPACES_CLUSTER_SHA: 8fd2e2a2d30010510bcd94f1f34a1c8aa3ca7a4c
      CODESPACES_CLUSTER_BRANCH: fix/pinned-bootstrap-receipts-20260928
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact codespaces-cluster head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/codespaces-cluster
          ref: ${{ env.CODESPACES_CLUSTER_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: codespaces-cluster
          persist-credentials: false

      - name: Assert exact source and missing lock
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CODESPACES_CLUSTER_SHA"
          git diff --check
          test ! -e Cargo.lock
          test "$(grep -F 'rust-version = "1.88"' Cargo.toml)" = 'rust-version = "1.88"'
          grep -F '.route("/routes", get(routes))' rust/edge.rs
          grep -F 'async fn routes(' rust/edge.rs
          grep -F 'use axum::body::{Body, to_bytes};' rust/service.rs

      - name: Install Rust 1.88.0
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
          rustup default 1.88.0
          rustc --version | grep -F 'rustc 1.88.0'
          cargo --version

      - name: Repair compile and Clippy defects
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          sed -i 's/\.route("\/routes", get(routes))/\.route("\/routes", get(routes_handler))/' rust/edge.rs
          sed -i 's/^async fn routes(/async fn routes_handler(/' rust/edge.rs
          sed -i 's/^use axum::body::{Body, to_bytes};$/use axum::body::to_bytes;/' rust/service.rs
          sed -i 's/trusted_header(&request.headers(),/trusted_header(request.headers(),/' rust/edge.rs
          sed -i 's/trusted_attempt(&request.headers())/trusted_attempt(request.headers())/' rust/edge.rs
          sed -i 's/trusted_proto(&request.headers())/trusted_proto(request.headers())/' rust/edge.rs
          grep -F '.route("/routes", get(routes_handler))' rust/edge.rs
          grep -F 'async fn routes_handler(' rust/edge.rs
          grep -F 'trusted_header(request.headers(), "x-ores-edge-request-id")' rust/edge.rs
          grep -F 'trusted_attempt(request.headers())' rust/edge.rs
          grep -F 'trusted_header(request.headers(), "x-ores-edge-original-host")' rust/edge.rs
          grep -F 'trusted_proto(request.headers())' rust/edge.rs
          grep -F 'use axum::body::to_bytes;' rust/service.rs

      - name: Materialize rustfmt repair and resolver-owned lockfile
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all
          cargo generate-lockfile
          test -s Cargo.lock
          git diff --check
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' rust/ctl.rs rust/edge.rs rust/service.rs | LC_ALL=C sort)"
          test "$changed" = "$expected"
          test "$(git status --short | grep -Fc '?? Cargo.lock')" -eq 1
          sha256sum Cargo.lock

      - name: Rustfmt check after deterministic repair
        working-directory: codespaces-cluster
        run: cargo fmt --all --check

      - name: Locked compile
        working-directory: codespaces-cluster
        run: cargo check --locked --all-targets

      - name: Locked strict Clippy
        working-directory: codespaces-cluster
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Locked tests
        working-directory: codespaces-cluster
        run: cargo test --locked --all-targets

      - name: Bootstrap receipt regression
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/bootstrap-pinned-cargo-tool.sh
          bash -n test/bootstrap-pinned-cargo-tool.sh
          bash test/bootstrap-pinned-cargo-tool.sh

      - name: Commit certified repair locally
        working-directory: codespaces-cluster
        shell: bash
        run: |
          set -Eeuo pipefail
          git add Cargo.lock rust/ctl.rs rust/edge.rs rust/service.rs
          git diff --cached --check
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git commit -m 'fix: certify locked Rust edge build'
          echo "CERTIFIED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fast-forward source branch with certified repair
        working-directory: codespaces-cluster
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "$CODESPACES_CLUSTER_SHA"
          gh auth setup-git
          git fetch --no-tags origin "$CODESPACES_CLUSTER_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$CODESPACES_CLUSTER_SHA"
          git push origin "HEAD:refs/heads/$CODESPACES_CLUSTER_BRANCH"
          echo "certified source commit: $CERTIFIED_COMMIT"
