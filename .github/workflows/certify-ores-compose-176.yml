name: certify ores-compose #176 exact head

on:
  pull_request:
    paths:
      - '.github/workflows/certify-ores-compose-176.yml'

permissions:
  contents: read

# The exact checkout is deep enough to contain EXPECTED_BASE_SHA; do not re-fetch after credentials are removed.
jobs:
  certify:
    if: github.head_ref == 'ci/certify-ores-compose-176-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_ORES_COMPOSE_SHA: 8156f0f079081ea0ff511d015643f89e4fec2634
      EXPECTED_BASE_SHA: 2e0d1488ca32371e4f410f95cf6886674b86876c
    steps:
      - name: Checkout certification harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: cert-harness
          persist-credentials: false
          submodules: false

      - name: Checkout exact ores-compose candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.EXPECTED_ORES_COMPOSE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-compose
          persist-credentials: false
          fetch-depth: 64

      - name: Assert exact candidate and one-file review surface
        shell: bash
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ORES_COMPOSE_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          test "$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | sort | tr '\n' ' ')" = 'tests/source_filter_execution_regressions.rs '
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          test -z "$(git status --porcelain)"

      - name: Configure private Cargo Git reads
        shell: bash
        working-directory: ores-compose
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          gh auth setup-git

      - name: Install reviewed Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'

      - name: Changed-file formatting
        shell: bash
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          rustfmt --edition 2024 --check tests/source_filter_execution_regressions.rs

      - name: All-target all-feature compile
        shell: bash
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          set -Eeuo pipefail
          cargo check --all-targets --all-features

      - name: Source-filter regression suite
        shell: bash
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          set -Eeuo pipefail
          cargo test --test source_filter_execution_regressions -- --nocapture

      - name: Full all-target all-feature tests
        shell: bash
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          set -Eeuo pipefail
          cargo test --all-targets --all-features

      - name: Strict Clippy
        shell: bash
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          set -Eeuo pipefail
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Assert candidate remained immutable
        if: always()
        shell: bash
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ORES_COMPOSE_SHA"
          test -z "$(git status --porcelain)" || {
            echo 'verification mutated candidate source' >&2
            git status --short >&2
            exit 1
          }
          echo ORES_COMPOSE_176_CERT_PASS
