name: certify ores-compose #178 exact head

on:
  pull_request:
    paths:
      - '.github/workflows/certify-ores-compose-176.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-ores-compose-176-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_ORES_COMPOSE_SHA: 202171eaaad46f9f9f2684622c8e8574b998a88b
      EXPECTED_BASE_SHA: 2deb9229521acd66f9f14bf858ac6f78c734d106
    steps:
      - name: Checkout certification harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: cert-harness
          persist-credentials: false
          submodules: false

      - name: Checkout exact ores-compose candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.EXPECTED_ORES_COMPOSE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-compose
          persist-credentials: false
          fetch-depth: 64

      - name: Assert exact candidate and one-file review surface
        shell: bash
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ORES_COMPOSE_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          test "$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | sort | tr '\n' ' ')" = 'tests/source_filter_execution_regressions.rs '
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          test -z "$(git status --porcelain)"

      - name: Configure private Cargo Git reads
        shell: bash
        working-directory: ores-compose
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          gh auth setup-git

      - name: Install reviewed Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'

      - name: Changed-file formatting
        shell: bash
        working-directory: ores-compose
        run: rustfmt --edition 2024 --check tests/source_filter_execution_regressions.rs

      - name: Locked all-target all-feature compile
        shell: bash
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo check --locked --all-targets --all-features

      - name: Source-filter regression suite
        shell: bash
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test --locked --test source_filter_execution_regressions -- --nocapture

      - name: Full locked all-target all-feature tests
        shell: bash
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test --locked --all-targets --all-features

      - name: Strict locked Clippy
        shell: bash
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Assert candidate remained immutable
        if: always()
        shell: bash
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ORES_COMPOSE_SHA"
          test -z "$(git status --porcelain)" || {
            echo 'verification mutated candidate source' >&2
            git status --short >&2
            exit 1
          }
          echo ORES_COMPOSE_178_CERT_PASS
