name: generate common desktop lock refresh

on:
  pull_request:
    paths:
      - '.github/workflows/generate-common-desktop-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-common-desktop-infra
          ref: 0ccaf83d32fb5bf901dce9b056f660028667d9af
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
          show-progress: false
          fetch-depth: 1
      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "0ccaf83d32fb5bf901dce9b056f660028667d9af"
          test "$(git -C source hash-object Cargo.lock)" = "d6ba369d48ecb631e5a56f1c87c20f5e64bbbc59"
      - name: Install declared Rust toolchain
        shell: bash
        run: rustup toolchain install 1.82.0 --profile minimal --component rustfmt,clippy
      - name: Regenerate only the workspace lock and prove it is usable
        working-directory: source
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.ORE_SOURCE_PAT }}@github.com/.insteadOf'
          GIT_CONFIG_VALUE_0: 'https://github.com/'
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.82.0 check -p ores-common-desktop-daemon --all-targets
          changed="$(git status --porcelain)"
          printf '%s\n' "$changed"
          test "$changed" = ' M Cargo.lock'
          cargo +1.82.0 check --locked -p ores-common-desktop-daemon --all-targets
          cargo +1.82.0 test --locked -p ores-common-desktop-daemon hot_reload_policy
      - name: Upload reviewed Cargo.lock candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ores-common-desktop-infra-cargo-lock
          path: source/Cargo.lock
          if-no-files-found: error
          retention-days: 7
