name: certify ClaimGraph intelligence #10

on:
  pull_request:
    paths:
      - '.github/workflows/certify-claimgraph-intelligence-10.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  certify:
    if: github.head_ref == 'ci/certify-claimgraph-intelligence-10-20260930'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: 4c17645be6f4e3db9e5a550ab54b293152a16a71
      EXPECTED_BASE_SHA: 22032cae30386f073d07c9b0166be583550ee72d
      EXPECTED_BLOB_SHA: fb8b5fdb6602725768364ef268fd7153bf033fec
      SOURCE_BRANCH: security/regression-feature-normalization-20260930
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact ClaimGraph candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ClaimGraph/claimgraph-intelligence.rs
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: claimgraph-intelligence
          persist-credentials: false
          fetch-depth: 32

      - name: Assert exact focused review surface and blob
        working-directory: claimgraph-intelligence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          mapfile -t files < <(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD)
          test "${#files[@]}" -eq 1
          test "${files[0]}" = 'src/regression.rs'
          test "$(git hash-object src/regression.rs)" = "$EXPECTED_BLOB_SHA"

      - name: Configure private Git reads and writes
        working-directory: claimgraph-intelligence
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: gh auth setup-git

      - name: Install verification and lock-surgery toolchains
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.82.0
          rustc --version | grep -F 'rustc 1.82.0'
          cargo +1.85.0 --version | grep -F 'cargo 1.85.0'

      - name: Verify changed source is rustfmt-clean
        working-directory: claimgraph-intelligence
        run: rustfmt +1.82.0 --edition 2021 --check src/regression.rs

      - name: Locked check with diagnostic capture
        id: locked_check
        continue-on-error: true
        working-directory: claimgraph-intelligence
        shell: bash
        run: |
          set +e
          cargo +1.82.0 check --locked --all-targets >"${RUNNER_TEMP}/locked-check.log" 2>&1
          code=$?
          cat "${RUNNER_TEMP}/locked-check.log"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Publish locked-check diagnostic
        if: steps.locked_check.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'Exact-head Rust 1.82 `cargo check --locked --all-targets` diagnostic:'
            echo
            echo '```text'
            tail -n 120 "${RUNNER_TEMP}/locked-check.log"
            echo '```'
          } > "${RUNNER_TEMP}/diagnostic.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "${RUNNER_TEMP}/diagnostic.md"

      - name: Repair Rust 1.82 lock compatibility and prove candidate
        id: repair_lock
        if: steps.locked_check.outputs.exit_code != '0'
        continue-on-error: true
        working-directory: claimgraph-intelligence
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set +e
          {
            git fetch origin "$SOURCE_BRANCH" &&
            test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$EXPECTED_SHA" &&
            cargo +1.85.0 update -p base64ct --precise 1.7.3 &&
            cargo +1.85.0 update -p idna_adapter --precise 1.2.0 &&
            cargo +1.85.0 update -p time --precise 0.3.44 &&
            test -n "$(git status --porcelain -- Cargo.lock)" &&
            cargo +1.82.0 check --locked --all-targets &&
            cargo +1.82.0 clippy --locked --all-targets -- -D warnings &&
            cargo +1.82.0 test --locked --all-targets
          } >"${RUNNER_TEMP}/repair.log" 2>&1
          code=$?
          cat "${RUNNER_TEMP}/repair.log"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if test "$code" -ne 0; then
            exit "$code"
          fi
          lock_sha256="$(sha256sum Cargo.lock | awk '{print $1}')"
          git config user.name 'ORESoftware CI'
          git config user.email 'ci@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build: pin Rust 1.82-compatible transitive dependencies'
          repaired_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$SOURCE_BRANCH"
          echo "repaired_sha=$repaired_sha" >> "$GITHUB_OUTPUT"
          echo "lock_sha256=$lock_sha256" >> "$GITHUB_OUTPUT"

      - name: Publish repair diagnostic
        if: steps.repair_lock.outputs.exit_code != '' && steps.repair_lock.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'Rust 1.82 lock compatibility repair diagnostic:'
            echo
            echo '```text'
            tail -n 200 "${RUNNER_TEMP}/repair.log"
            echo '```'
          } > "${RUNNER_TEMP}/repair-diagnostic.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "${RUNNER_TEMP}/repair-diagnostic.md"

      - name: Strict Clippy on already-compatible lock
        if: steps.locked_check.outputs.exit_code == '0'
        working-directory: claimgraph-intelligence
        run: cargo +1.82.0 clippy --locked --all-targets -- -D warnings

      - name: Locked tests on already-compatible lock
        if: steps.locked_check.outputs.exit_code == '0'
        working-directory: claimgraph-intelligence
        run: cargo +1.82.0 test --locked --all-targets

      - name: Report repaired source head
        if: steps.repair_lock.outputs.repaired_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "Pinned Rust-1.82-compatible transitive versions in the source lock only after exact-head Rust 1.82 check/Clippy/tests passed. Pushed source head \`${{ steps.repair_lock.outputs.repaired_sha }}\`; Cargo.lock SHA-256 \`${{ steps.repair_lock.outputs.lock_sha256 }}\`. Re-pin this carrier before promotion."

      - name: Assert source result
        if: always()
        shell: bash
        run: |
          if test "${{ steps.locked_check.outputs.exit_code }}" = '0'; then
            exit 0
          fi
          test "${{ steps.repair_lock.outputs.exit_code }}" = '0'
          test -n "${{ steps.repair_lock.outputs.repaired_sha }}"
