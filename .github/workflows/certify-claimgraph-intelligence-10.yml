name: certify ClaimGraph intelligence #10

on:
  pull_request:
    paths:
      - '.github/workflows/certify-claimgraph-intelligence-10.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-claimgraph-intelligence-10-20260930'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: 9709a69f56056ba76f446568918ba5fa9e225147
      EXPECTED_BASE_SHA: 22032cae30386f073d07c9b0166be583550ee72d
      EXPECTED_REGRESSION_BLOB: fb8b5fdb6602725768364ef268fd7153bf033fec
      EXPECTED_LOCK_BLOB: 513d4c915a24c31ef3e2ee3d0bcb10510ef810f0
    steps:
      - name: Check out carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check out exact ClaimGraph candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ClaimGraph/claimgraph-intelligence.rs
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: claimgraph-intelligence
          persist-credentials: false
          fetch-depth: 32

      - name: Assert exact review surface and blobs
        working-directory: claimgraph-intelligence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          mapfile -t files < <(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | sort)
          test "${#files[@]}" -eq 2
          test "${files[0]}" = 'Cargo.lock'
          test "${files[1]}" = 'src/regression.rs'
          test "$(git hash-object src/regression.rs)" = "$EXPECTED_REGRESSION_BLOB"
          test "$(git hash-object Cargo.lock)" = "$EXPECTED_LOCK_BLOB"

      - name: Install Rust 1.82
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt,clippy
          rustup default 1.82.0
          rustc --version | grep -F 'rustc 1.82.0'

      - name: Verify formatting
        working-directory: claimgraph-intelligence
        run: cargo +1.82.0 fmt --all -- --check

      - name: Locked check
        working-directory: claimgraph-intelligence
        run: cargo +1.82.0 check --locked --all-targets

      - name: Strict Clippy
        working-directory: claimgraph-intelligence
        run: cargo +1.82.0 clippy --locked --all-targets -- -D warnings

      - name: Locked tests
        working-directory: claimgraph-intelligence
        run: cargo +1.82.0 test --locked --all-targets
