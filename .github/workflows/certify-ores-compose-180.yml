name: certify ores-compose 180

on:
  push:
    branches:
      - ci/certify-ores-compose-180-20260922

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: 65681bd722cfa0667192956da5368aa814e58a60
      EXPECTED_BASE_SHA: b0134dca90af18d642a331603b0538f3964967a1
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 64

      - name: Guard exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          test "$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD)" = "src/trusted_working_directory.rs"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          test -z "$(git status --porcelain)"

      - name: Configure private Cargo reads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: gh auth setup-git

      - name: Install Rust 1.98.1
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version | grep -F "rustc 1.98.1"

      - name: Formatting
        shell: bash
        run: rustfmt --edition 2024 --check src/trusted_working_directory.rs

      - name: Locked all-target compile
        shell: bash
        run: cargo check --locked --all-targets --all-features

      - name: Trusted directory unit tests
        shell: bash
        run: cargo test --locked --lib trusted_working_directory::tests:: -- --test-threads=1

      - name: Repeat replacement identity test 100 times
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 100); do
            cargo test --locked --lib trusted_working_directory::tests::replacement_after_admission_is_detected -- --exact --test-threads=1 >/dev/null
          done

      - name: Content mutation remains admitted
        shell: bash
        run: cargo test --locked --lib trusted_working_directory::tests::directory_content_changes_do_not_change_admitted_identity -- --exact --test-threads=1

      - name: Source-owned Clippy
        shell: bash
        run: cargo clippy --locked --lib --no-deps -- -A warnings -D clippy::all

      - name: Immutable source guard
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
