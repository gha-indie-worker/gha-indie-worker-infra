name: certify ores-compose #180 exact head

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/certify-ores-compose-180.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-ores-compose-180-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: 65681bd722cfa0667192956da5368aa814e58a60
      EXPECTED_BASE_SHA: b0134dca90af18d642a331603b0538f3964967a1
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: cert-harness
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-compose
          persist-credentials: false
          fetch-depth: 64

      - name: Guard exact one-file surface
        shell: bash
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          test "$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | tr '\n' ' ')" = 'src/trusted_working_directory.rs '
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          test -z "$(git status --porcelain)"

      - name: Configure private Cargo reads
        shell: bash
        working-directory: ores-compose
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: gh auth setup-git

      - name: Install Rust 1.98.1
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'

      - name: Prepare exact base
        shell: bash
        working-directory: ores-compose
        run: git worktree add --detach /tmp/ores-compose-base "$EXPECTED_BASE_SHA"

      - name: Formatting
        shell: bash
        working-directory: ores-compose
        run: rustfmt --edition 2024 --check src/trusted_working_directory.rs

      - name: Locked all-target compile
        shell: bash
        working-directory: ores-compose
        run: cargo check --locked --all-targets --all-features

      - name: Trusted working-directory tests
        shell: bash
        working-directory: ores-compose
        run: cargo test --locked --lib trusted_working_directory::tests:: -- --test-threads=1

      - name: Repeated replacement detection
        shell: bash
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 100); do
            echo "replacement detection iteration $i"
            cargo test --locked --lib trusted_working_directory::tests::replacement_after_admission_is_detected -- --exact --test-threads=1 >/tmp/replacement-test.log 2>&1 || {
              cat /tmp/replacement-test.log
              exit 1
            }
          done

      - name: Ordinary content mutation remains valid
        shell: bash
        working-directory: ores-compose
        run: cargo test --locked --lib trusted_working_directory::tests::directory_content_changes_do_not_change_admitted_identity -- --exact --test-threads=1

      - name: Compare strict Clippy diagnostics with exact base
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          (cd ores-compose && cargo clippy --locked --all-targets --all-features --message-format=json -- -D warnings) > /tmp/head.jsonl 2>/tmp/head.stderr
          head_rc=$?
          (cd /tmp/ores-compose-base && cargo clippy --locked --all-targets --all-features --message-format=json -- -D warnings) > /tmp/base.jsonl 2>/tmp/base.stderr
          base_rc=$?
          set -e
          export HEAD_RC="$head_rc" BASE_RC="$base_rc"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          def normalize(path):
              p=str(path or '').replace('\\','/')
              for marker in ('/ores-compose-base/','/ores-compose/'):
                  if marker in p:
                      return p.split(marker,1)[1]
              return p
          def diags(path):
              out=set()
              for raw in Path(path).read_text(errors='replace').splitlines():
                  try: row=json.loads(raw)
                  except Exception: continue
                  if row.get('reason')!='compiler-message': continue
                  msg=row.get('message') or {}
                  if msg.get('level') not in ('warning','error'): continue
                  spans=msg.get('spans') or []
                  primary=next((s for s in spans if s.get('is_primary')), spans[0] if spans else {})
                  out.add(((msg.get('code') or {}).get('code') or '', msg.get('message') or '', normalize(primary.get('file_name'))))
              return out
          base=diags('/tmp/base.jsonl'); head=diags('/tmp/head.jsonl'); new=sorted(head-base)
          print(f"clippy rc base={os.environ['BASE_RC']} head={os.environ['HEAD_RC']}; diagnostics base={len(base)} head={len(head)} new={len(new)}")
          for item in new: print('NEW:', item)
          if int(os.environ['BASE_RC']) == 0:
              assert int(os.environ['HEAD_RC']) == 0
          assert not new, 'candidate introduced strict-Clippy diagnostics'
          PY

      - name: Immutable source guard
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ores-compose rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git -C /tmp/ores-compose-base rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          test -z "$(git -C ores-compose status --porcelain)"
          test -z "$(git -C /tmp/ores-compose-base status --porcelain)"
