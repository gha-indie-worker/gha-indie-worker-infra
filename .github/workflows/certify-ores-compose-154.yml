name: certify ores-compose service env

on:
  pull_request:
    paths:
      - '.github/workflows/certify-ores-compose-154.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-ores-compose-154-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_ORES_COMPOSE_SHA: 14b10f64ef6e77430ce60fc8a2df9f5bea41ccbf
    steps:
      - name: Checkout certification harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: cert-harness
          persist-credentials: false
          submodules: false

      - name: Checkout exact ores-compose candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.EXPECTED_ORES_COMPOSE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-compose
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact candidate identity
        shell: bash
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_ORES_COMPOSE_SHA" || {
            echo "expected $EXPECTED_ORES_COMPOSE_SHA, got $actual" >&2
            exit 1
          }
          test -z "$(git status --porcelain)" || {
            echo 'candidate checkout is dirty' >&2
            exit 1
          }
          printf '%s\n' "$actual" > ../ores-compose-exact-head.sha

      - name: Configure private Cargo Git reads
        shell: bash
        working-directory: ores-compose
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          gh auth setup-git

      - name: Install reviewed Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'

      - name: Rust format for PR-owned files
        shell: bash
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          rustfmt --edition 2021 --config skip_children=true --check \
            src/config_loader.rs \
            src/local_up_process.rs \
            src/service_environment.rs \
            src/up_orchestrator.rs

      - name: Clippy compile and PR-owned lint gate
        shell: bash
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          set -Eeuo pipefail
          cargo clippy --all-targets --all-features --message-format=json 2>target/clippy-stderr.log | tee target/clippy.jsonl >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          owned = {
              'src/config_loader.rs',
              'src/local_up_process.rs',
              'src/service_environment.rs',
              'src/up_orchestrator.rs',
          }
          failures = []
          for raw in Path('target/clippy.jsonl').read_text().splitlines():
              try:
                  event = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if event.get('reason') != 'compiler-message':
                  continue
              message = event.get('message') or {}
              if message.get('level') != 'warning':
                  continue
              spans = message.get('spans') or []
              touched = sorted({s.get('file_name') for s in spans if s.get('file_name') in owned})
              if touched:
                  code = (message.get('code') or {}).get('code') or 'warning'
                  failures.append((touched, code, message.get('message', '')))
          if failures:
              for touched, code, text in failures:
                  print(f'PR-owned Clippy warning {code} in {touched}: {text}')
              raise SystemExit(1)
          print('No Clippy warnings touch PR-owned Rust files.')
          PY

      - name: Rust tests
        shell: bash
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          set -Eeuo pipefail
          cargo test --all-targets --all-features

      - name: Contract and conformance authority checks
        shell: bash
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          bash conformance/check.sh
          mkdir -p target
          npx --yes \
            --package=https://github.com/ORESoftware/typespec-json-schema-validator/archive/db0f1e66b2a65cad43c909aa558ae00c6a91578c.tar.gz \
            tjsv check \
            --typespec=contracts/typespec/main.tsp \
            --schema=contracts/json-schema/contract.schema.json \
            --instances=contracts/instances \
            --report=target/compose-contract-parity.json \
            --quiet

      - name: Assert candidate remained immutable
        if: always()
        shell: bash
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ORES_COMPOSE_SHA"
          test -z "$(git status --porcelain)" || {
            echo 'verification mutated candidate source' >&2
            git status --short >&2
            exit 1
          }
