# Terraform checks for the two platform roots. CI NEVER applies.
name: terraform

on:
  pull_request:
    paths:
      - "modules/**"
      - "environments/**"
      - ".ores-infra.toml"
      - ".github/workflows/terraform.yml"
      - "scripts/hcl-sanity.py"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
      - ".ores-infra.toml"
      - ".github/workflows/terraform.yml"
      - "scripts/hcl-sanity.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  static:
    name: fmt, validate, sanity (${{ matrix.root.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        root:
          - { name: cloudflare-platform, path: production/cloudflare-platform }
          - { name: gcp-platform, path: production/gcp-platform }
    defaults:
      run:
        working-directory: environments/${{ matrix.root.path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform fmt -check -diff -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - name: offline sanity checks
        working-directory: .
        run: |
          python3 scripts/hcl-sanity.py modules
          python3 scripts/hcl-sanity.py environments

  plan:
    name: plan (${{ matrix.root.name }})
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: terraform-plan
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        root:
          - { name: cloudflare-platform, path: production/cloudflare-platform, provider: cloudflare }
          - { name: gcp-platform, path: production/gcp-platform, provider: gcp }
    defaults:
      run:
        working-directory: environments/${{ matrix.root.path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Authenticate to Google Cloud
        if: matrix.root.provider == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: terraform init -input=false
      - name: terraform plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.TF_VAR_CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_zone_id: ${{ vars.TF_VAR_ZONE_ID }}
          TF_VAR_k8s_origin_ip: ${{ secrets.TF_VAR_K8S_ORIGIN_IP }}
          TF_VAR_aws_origin_ip: ${{ vars.TF_VAR_AWS_ORIGIN_IP }}
          TF_VAR_admin_access_emails: ${{ secrets.TF_VAR_ADMIN_ACCESS_EMAILS }}
          TF_VAR_admin_access_group_id: ${{ vars.TF_VAR_ADMIN_ACCESS_GROUP_ID }}
          TF_VAR_cloud_run_web_host: ${{ vars.TF_VAR_CLOUD_RUN_WEB_HOST }}
          TF_VAR_cloud_run_api_host: ${{ vars.TF_VAR_CLOUD_RUN_API_HOST }}
          TF_VAR_cloud_run_admin_web_host: ${{ vars.TF_VAR_CLOUD_RUN_ADMIN_WEB_HOST }}
          TF_VAR_cloud_run_admin_api_host: ${{ vars.TF_VAR_CLOUD_RUN_ADMIN_API_HOST }}
          TF_VAR_project_id: ${{ vars.TF_VAR_PROJECT_ID }}
          TF_VAR_shared_auth_base: ${{ vars.TF_VAR_SHARED_AUTH_BASE }}
          TF_VAR_shared_auth_admin_base: ${{ vars.TF_VAR_SHARED_AUTH_ADMIN_BASE }}
          TF_VAR_admin_api_base: ${{ vars.TF_VAR_ADMIN_API_BASE }}
          TF_VAR_admin_allowlist: ${{ secrets.TF_VAR_ADMIN_ALLOWLIST }}
        run: terraform plan -no-color -lock=false -out=tfplan | tee plan.txt
      - name: Comment plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'environments/${{ matrix.root.path }}/plan.txt';
            let body = fs.readFileSync(path, 'utf8');
            const limit = 60000;
            if (body.length > limit) body = body.slice(0, limit) + `\n... truncated (${body.length} bytes)`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### terraform plan — \`${{ matrix.root.name }}\`\n\n<details><summary>plan output</summary>\n\n\`\`\`terraform\n${body}\n\`\`\`\n\n</details>\n\n_Plan only. CI never applies._`,
            });
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.root.name }}
          path: environments/${{ matrix.root.path }}/tfplan
          retention-days: 7
          if-no-files-found: error
