name: certify ores-websocket #20

on:
  pull_request:
    paths:
      - '.github/workflows/certify-ores-websocket-20.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-ores-websocket-20-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ce06d105a89cebf8b305419a7557ad784f38f903
      EXPECTED_BASE_SHA: 3da5602b7c645a886eb23b2b33ab3f6e8296b0b3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact ores-websocket candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-websocket
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-websocket
          persist-credentials: false
          fetch-depth: 8

      - name: Assert exact three-file current-main surface
        working-directory: ores-websocket
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          mapfile -t files < <(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | grep -Fx 'src/admission.rs'
          printf '%s\n' "${files[@]}" | grep -Fx 'src/rpc_session.rs'
          printf '%s\n' "${files[@]}" | grep -Fx 'src/axum_support.rs'

      - name: Install declared Rust boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
          rustc --version | grep -F 'rustc 1.88.0'

      - name: Capture exact rustfmt output
        working-directory: ores-websocket
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all
          git diff -- src/admission.rs src/rpc_session.rs src/axum_support.rs > "${RUNNER_TEMP}/ores-websocket-20-rustfmt.patch"
          if ! git diff --quiet -- src/admission.rs src/rpc_session.rs src/axum_support.rs; then
            echo 'ores-websocket #20 is not rustfmt-clean; exact patch and formatted files are uploaded' >&2
            exit 1
          fi

      - name: Upload rustfmt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ores-websocket-20-rustfmt-${{ env.EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/ores-websocket-20-rustfmt.patch
            ores-websocket/src/admission.rs
            ores-websocket/src/rpc_session.rs
            ores-websocket/src/axum_support.rs
          if-no-files-found: error
          retention-days: 7

      - name: Strict Clippy all features
        working-directory: ores-websocket
        run: cargo clippy --locked --all-targets --all-features -- -D warnings -A clippy::needless-return

      - name: Locked tests all features
        working-directory: ores-websocket
        run: cargo test --locked --all-targets --all-features

      - name: Assert source checkout stayed immutable
        if: always()
        working-directory: ores-websocket
        shell: bash
        run: |
          git checkout -- src/admission.rs src/rpc_session.rs src/axum_support.rs || true
          test -z "$(git status --porcelain)"
