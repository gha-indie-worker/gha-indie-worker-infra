name: certify bmscl-cli #67

on:
  pull_request:
    paths:
      - '.github/workflows/certify-bmscl-cli-67.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-bmscl-cli-67-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BMSCL_SHA: dfe7711bc59a6484c9430744e5c9d9126f446423
    steps:
      - name: Check out carrier exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Require cross-org source credential
        env:
          TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: test -n "$TOKEN"

      - name: Check out exact bmscl-cli candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: beamscale/bmscl-cli
          ref: ${{ env.BMSCL_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: bmscl-cli
          persist-credentials: false

      - name: Assert exact candidate and clean tree
        working-directory: bmscl-cli
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BMSCL_SHA"
          test -z "$(git status --porcelain)"

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy

      - name: Install exact Erlang runtime
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.1.1"
          version-type: strict

      - name: Compile persistent Erlang dev bridge
        working-directory: bmscl-cli
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/bmscl-dev-bridge"
          erlc -o "$RUNNER_TEMP/bmscl-dev-bridge" support/bmscl_dev_bridge.erl
          test -f "$RUNNER_TEMP/bmscl-dev-bridge/bmscl_dev_bridge.beam"

      - name: Rust fmt, Clippy, and tests
        working-directory: bmscl-cli
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo +1.90.0 fmt --all -- --check
          cargo +1.90.0 clippy --all-targets --all-features -- -D warnings
          cargo +1.90.0 test --all-targets

      - name: Exhaust bounded deployment admission state space
        working-directory: bmscl-cli
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc +1.90.0 --edition=2021 -D warnings conformance/formal_model.rs -o "$RUNNER_TEMP/formal-model"
          "$RUNNER_TEMP/formal-model"

      - name: Prove typed local service public surface
        working-directory: bmscl-cli
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo +1.90.0 run --quiet -- local service --help > "$RUNNER_TEMP/service-help.txt"
          grep -F 'install' "$RUNNER_TEMP/service-help.txt"
          grep -F 'status' "$RUNNER_TEMP/service-help.txt"
          grep -F 'uninstall' "$RUNNER_TEMP/service-help.txt"

      - name: Assert production candidate remained immutable
        if: always()
        working-directory: bmscl-cli
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BMSCL_SHA"
          test -z "$(git status --porcelain)"
