name: certify ores-compose #175 exhaustive dependency-wave proof

on:
  pull_request:
    paths:
      - '.github/workflows/certify-ores-compose-175.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-ores-compose-175-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_SHA: 243c53eba5f32a73fb10d3a8dbec206553e76df3
      EXPECTED_BASE_SHA: b0134dca90af18d642a331603b0538f3964967a1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact ores-compose candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-compose
          persist-credentials: false
          fetch-depth: 64

      - name: Assert exact one-file review surface
        working-directory: ores-compose
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          test "$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | tr '\n' ' ')" = 'tests/formal_dependency_graph_exhaustive.rs '
          git diff --check "$EXPECTED_BASE_SHA"..HEAD

      - name: Configure private Cargo Git reads
        working-directory: ores-compose
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: gh auth setup-git

      - name: Install Rust 1.98.1
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'

      - name: Changed-file rustfmt
        working-directory: ores-compose
        run: rustfmt --edition 2024 --check tests/formal_dependency_graph_exhaustive.rs

      - name: Locked all-target compile
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo check --locked --all-targets --all-features

      - name: Run bounded exhaustive dependency-wave proof
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test --locked --test formal_dependency_graph_exhaustive -- --nocapture

      - name: Assert candidate remained immutable
        if: always()
        working-directory: ores-compose
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          echo ORES_COMPOSE_175_CERT_PASS
