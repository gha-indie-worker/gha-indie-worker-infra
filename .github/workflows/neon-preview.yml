name: neon-preview

# A Neon branch per PR on the two PRODUCT projects. The admin project is deliberately excluded:
# it is provisioned closed and no CI job may open a connection to it.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "neon/**"
      - "modules/neon/**"
      - "environments/production/neon/**"
      - ".db-providers.json"
      - ".github/workflows/neon-preview.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  branch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - crimson-cell-39815049 # canonical
          - fancy-brook-94928157  # auth
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - if: github.event.action != 'closed'
        uses: neondatabase/create-branch-action@34f619c41c6e67b4f2f13f1c6eae90827a5f2cf4
        with:
          project_id: ${{ matrix.project }}
          branch_name: preview/pr-${{ github.event.number }}-${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - if: github.event.action == 'closed'
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776
        with:
          project_id: ${{ matrix.project }}
          branch: preview/pr-${{ github.event.number }}-${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
