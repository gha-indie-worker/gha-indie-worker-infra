name: certify and publish ores-compose OCI repair

on:
  push:
    branches:
      - ci/certify-ores-compose-317-20260928
    paths:
      - '.github/workflows/certify-ores-compose-317.yml'
  pull_request:
    paths:
      - '.github/workflows/certify-ores-compose-317.yml'

permissions:
  contents: read

jobs:
  certify:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'ci/certify-ores-compose-317-20260928') ||
      github.head_ref == 'ci/certify-ores-compose-317-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_BRANCH: fix/oci-error-contract-and-clippy-20260928
      EXPECTED_BASE_SHA: 374d322b8cdecb813d999a695ecec27b086b5d2e
      EXPECTED_PREPATCH_SHA: 607d53e643a82d159b4a408da033c16dd3c353da
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact ores-compose repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.SOURCE_BRANCH }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-compose
          persist-credentials: true
          fetch-depth: 32

      - name: Assert and apply exact two-file repair
        working-directory: ores-compose
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PREPATCH_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          python3 - <<'PY'
          from pathlib import Path

          deployment = Path('src/deployment.rs')
          text = deployment.read_text()
          old = '        let canonical_digest = Sha256Digest::new(digest.to_string())?;\n'
          new = '''        let canonical_digest = Sha256Digest::new(digest.to_string())\n            .map_err(|_| DeploymentPlanError::InvalidOciImageDigestRef)?;\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one OCI digest propagation site, found {text.count(old)}')
          deployment.write_text(text.replace(old, new, 1))

          runtime = Path('src/runtime_control.rs')
          text = runtime.read_text()
          import_line = 'use std::env;\n'
          if text.count(import_line) != 1:
              raise SystemExit(f'expected one std::env import, found {text.count(import_line)}')
          text = text.replace(import_line, '', 1)
          old_temp = '        let root = env::temp_dir().join(format!("ores-compose-runtime-control-{nonce}"));\n'
          new_temp = '        let root = std::env::temp_dir().join(format!("ores-compose-runtime-control-{nonce}"));\n'
          if text.count(old_temp) != 1:
              raise SystemExit(f'expected one test temp-dir call, found {text.count(old_temp)}')
          runtime.write_text(text.replace(old_temp, new_temp, 1))
          PY
          rm .github/workflows/autofix-oci-error-contract.yml
          git diff --check
          actual="$(git diff --name-only "$EXPECTED_BASE_SHA" | sort | tr '\n' ' ')"
          test "$actual" = 'src/deployment.rs src/runtime_control.rs '
          grep -F '.map_err(|_| DeploymentPlanError::InvalidOciImageDigestRef)?;' src/deployment.rs
          ! grep -F '^use std::env;' src/runtime_control.rs
          grep -F 'let root = std::env::temp_dir().join' src/runtime_control.rs

      - name: Configure private Cargo Git reads
        working-directory: ores-compose
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: gh auth setup-git

      - name: Install Rust 1.98.1
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'

      - name: Format repair and reassert exact diff
        working-directory: ores-compose
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          actual="$(git diff --name-only "$EXPECTED_BASE_SHA" | sort | tr '\n' ' ')"
          test "$actual" = 'src/deployment.rs src/runtime_control.rs '
          grep -F 'DeploymentPlanError::InvalidOciImageDigestRef' src/deployment.rs
          ! grep -F '^use std::env;' src/runtime_control.rs
          grep -F 'let root = std::env::temp_dir().join' src/runtime_control.rs

      - name: Locked all-target compile
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo check --locked --all-targets --all-features

      - name: Full Rust tests
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test --locked --all-targets --all-features

      - name: Strict Clippy
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Commit and publish certified repair
        working-directory: ores-compose
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ORESoftware certification'
          git config user.email 'actions@users.noreply.github.com'
          git add src/deployment.rs src/runtime_control.rs
          git add -u .github/workflows/autofix-oci-error-contract.yml
          git commit -m 'fix: preserve OCI reference error boundary'
          actual="$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | sort | tr '\n' ' ')"
          test "$actual" = 'src/deployment.rs src/runtime_control.rs '
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          git push origin "HEAD:$SOURCE_BRANCH"
          echo "ORES_COMPOSE_CERTIFIED_SHA=$(git rev-parse HEAD)"
