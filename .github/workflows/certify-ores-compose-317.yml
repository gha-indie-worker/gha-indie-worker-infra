name: certify ores-compose compile repair chain

on:
  pull_request:
    paths:
      - '.github/workflows/certify-ores-compose-317.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-ores-compose-317-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: 24bc19401e6f8ef8837b2bb9e86e3cca01dabe8f
      EXPECTED_BASE_SHA: 3b99e89139dedc5482838efff419ba0840f0884d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact ores-compose candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-compose
          persist-credentials: false
          fetch-depth: 32

      - name: Assert exact one-line review surface
        working-directory: ores-compose
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          actual="$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | sort | tr '\n' ' ')"
          test "$actual" = 'src/machine_event.rs '
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          changed="$(git diff --numstat "$EXPECTED_BASE_SHA"..HEAD -- src/machine_event.rs)"
          test "$changed" = $'1\t1\tsrc/machine_event.rs'
          grep -F 'let newest = log.append_enqueued(job("2"), false).expect("second");' src/machine_event.rs
          ! grep -F '.expect("second").event_id();' src/machine_event.rs

      - name: Configure private Cargo Git reads
        working-directory: ores-compose
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: gh auth setup-git

      - name: Install Rust 1.98.1
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'

      - name: Locked all-target compile
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo check --locked --all-targets --all-features

      - name: Full Rust tests
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test --locked --all-targets --all-features

      - name: Strict Clippy
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Assert candidate remained immutable
        if: always()
        working-directory: ores-compose
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          echo ORES_COMPOSE_318_CERT_PASS
