name: certify ores-compose #317 compile repair

on:
  pull_request:
    paths:
      - '.github/workflows/certify-ores-compose-317.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-ores-compose-317-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ceb2134c4f90f1a66e4a07166f1ea04d64be6b89
      EXPECTED_BASE_SHA: 6b77749a9fd56d2d2f81316ba9bcdb4c6763c382
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact ores-compose candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-compose
          persist-credentials: false
          fetch-depth: 32

      - name: Assert exact one-line review surface
        working-directory: ores-compose
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          actual="$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | sort | tr '\n' ' ')"
          test "$actual" = 'src/deployment.rs '
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          added="$(git diff --numstat "$EXPECTED_BASE_SHA"..HEAD -- src/deployment.rs)"
          test "$added" = $'1\t1\tsrc/deployment.rs'
          grep -F 'repository.as_bytes().contains(&0x5c)' src/deployment.rs

      - name: Configure private Cargo Git reads
        working-directory: ores-compose
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: gh auth setup-git

      - name: Install Rust 1.98.1
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'

      - name: Locked all-target compile
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo check --locked --all-targets --all-features

      - name: Full Rust tests
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test --locked --all-targets --all-features

      - name: Strict Clippy
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Assert candidate remained immutable
        if: always()
        working-directory: ores-compose
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          echo ORES_COMPOSE_317_CERT_PASS
