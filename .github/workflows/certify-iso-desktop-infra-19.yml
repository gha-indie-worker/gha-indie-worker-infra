name: certify Iso desktop infra #19

on:
  pull_request:
    paths:
      - '.github/workflows/certify-iso-desktop-infra-19.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-iso-desktop-infra-19-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ISO_SHA: cbbcff188320ba04188a97651f603fc65a5afa73
      COMMON_SHA: 20ec084cc550c824c009d5413de84ab519081bd7
    steps:
      - name: Check out carrier exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact Iso desktop-infra candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iso-lattes/isl-desktop-infra
          ref: ${{ env.ISO_SHA }}
          path: iso-desktop-infra
          persist-credentials: false

      - name: Assert exact Iso candidate
        working-directory: iso-desktop-infra
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ISO_SHA"
          test -z "$(git status --porcelain)"

      - name: Require common desktop source credential
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: test -n "$ORE_SOURCE_PAT"

      - name: Check out exact common desktop authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-common-desktop-infra
          ref: ${{ env.COMMON_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: common-desktop
          persist-credentials: false

      - name: Assert exact common authority
        working-directory: common-desktop
        run: test "$(git rev-parse HEAD)" = "$COMMON_SHA"

      - name: Configure private Cargo Git reads
        working-directory: common-desktop
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: gh auth setup-git

      - name: Install pinned Rust
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.82.0 --profile minimal
          rustup default 1.82.0
          rustc --version | grep -F 'rustc 1.82.0'

      - name: Run shared Rust appliance conformance against exact Iso head
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo run --locked \
            --manifest-path common-desktop/Cargo.toml \
            -p ores-common-desktop-conformance \
            --bin validate_appliance_contract \
            -- "$GITHUB_WORKSPACE/iso-desktop-infra"

      - name: Prove locked isolate daemon source pin carries Cargo.lock
        shell: bash
        run: |
          set -Eeuo pipefail
          daemon_sha="$(awk '/^[[:space:]]*commit:/ { print $2; exit }' iso-desktop-infra/.ores-compose.yaml)"
          test "$daemon_sha" = '2d81f3ed81a7eac5096cdcfecfbc3e6d83c2c18a'
          test "$(grep -c -- '--locked' iso-desktop-infra/.ores-compose.yaml)" -ge 1
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/iso-lattes/isl-desktop-daemon/$daemon_sha/Cargo.lock" \
            | grep -F 'version = 4'

      - name: Assert checked-out candidates remained immutable
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C iso-desktop-infra rev-parse HEAD)" = "$ISO_SHA"
          test "$(git -C common-desktop rev-parse HEAD)" = "$COMMON_SHA"
          test -z "$(git -C iso-desktop-infra status --porcelain)"
          git -C common-desktop clean -fd -- target
          test -z "$(git -C common-desktop status --porcelain)"
