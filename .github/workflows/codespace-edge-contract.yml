name: Codespace edge contract

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.ores-compose.yaml'
      - 'config/codespaces-cluster.toml'
      - 'config/codespaces-cluster.rev'
      - 'config/ores-cli.rev'
      - 'config/ores-compose.rev'
      - 'Justfile'
      - 'tools/dev-runtime/**'
      - 'docs/local-development.md'
      - '.github/workflows/codespace-edge-contract.yml'
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.ores-compose.yaml'
      - 'config/codespaces-cluster.toml'
      - 'config/codespaces-cluster.rev'
      - 'config/ores-cli.rev'
      - 'config/ores-compose.rev'
      - 'Justfile'
      - 'tools/dev-runtime/**'
      - 'docs/local-development.md'
      - '.github/workflows/codespace-edge-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codespace-edge-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - name: Compile and run Rust contract tests
        run: cargo test --locked --manifest-path tools/dev-runtime/Cargo.toml
      - name: Run static contract validator
        run: cargo run --locked --manifest-path tools/dev-runtime/Cargo.toml -- validate
      - name: Check application and edge lifecycle contract
        shell: bash
        run: |
          set -euo pipefail

          ores_cli_rev="$(tr -d '[:space:]' < config/ores-cli.rev)"
          test "$ores_cli_rev" = 'c854130ee147e9793a3af8736e90241630a5c934'
          [[ "$ores_cli_rev" =~ ^[0-9a-f]{40}$ ]]
          grep -Fq -- "--rev $ores_cli_rev" .devcontainer/devcontainer.json

          ores_compose_rev="$(tr -d '[:space:]' < config/ores-compose.rev)"
          test "$ores_compose_rev" = '8a01df4227a44b0b25741b7ef4a910ec4a4dc75f'
          [[ "$ores_compose_rev" =~ ^[0-9a-f]{40}$ ]]
          grep -Fq -- "--rev $ores_compose_rev" .devcontainer/devcontainer.json

          grep -Fq 'ORESoftware/codespaces-cluster' .devcontainer/devcontainer.json
          grep -Fq 'gh repo view ORESoftware/codespaces-cluster --json name' .devcontainer/devcontainer.json
          grep -Fq 'just codespace-edge-check' .devcontainer/devcontainer.json
          grep -Fq 'codespace-edge-up:' Justfile
          grep -Fq 'codespace-edge-status:' Justfile
          grep -Fq 'codespace-edge-down:' Justfile
          grep -Fq 'codespace-edge-check:' Justfile
          grep -Fq 'GH_TOKEN="$token" gh repo clone ORESoftware/codespaces-cluster' Justfile
          grep -Fq 'GH_TOKEN="$token" git -C "$root" fetch --prune origin main' Justfile
          grep -Fq 'GH_TOKEN="$token" just codespace-edge-bootstrap' Justfile
          ! grep -Fq 'export GH_TOKEN=' Justfile
          grep -Fq 'ORES_CODESPACES_CLUSTER_STATE_DIR=.ores/codespaces-cluster-app' Justfile
          grep -Fq 'ORES_CODESPACES_CLUSTER_READY_PORT=18091' Justfile
          grep -Fq 'CODESPACES_CLUSTER_CONFIG="$repo/config/codespaces-cluster.toml"' Justfile
          grep -Fq 'http://127.0.0.1:8080/api/readyz' Justfile
          grep -Fq '"onAutoForward": "ignore"' .devcontainer/devcontainer.json

          rev="$(tr -d '[:space:]' < config/codespaces-cluster.rev)"
          test "$rev" = '9d1e9709fa2ba0fccdf920731cdfa5673a77e5f6'
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]]

          cfg=config/codespaces-cluster.toml
          test -s "$cfg"
          grep -Fq 'listen = "127.0.0.1:8080"' "$cfg"
          grep -Fq 'prefix = "/api"' "$cfg"
          grep -Fq 'upstream = "http://127.0.0.1:18090"' "$cfg"
          grep -Fq 'prefix = "/"' "$cfg"
          grep -Fq 'upstream = "http://127.0.0.1:18091"' "$cfg"
          test "$(grep -Fc 'required = true' "$cfg")" -eq 2

          grep -Fq 'API: `127.0.0.1:18090`' docs/local-development.md
          grep -Fq 'web: `127.0.0.1:18091`' docs/local-development.md
          grep -Fq 'Port `8080` is reserved exclusively' docs/local-development.md
          grep -Fq 'read-only Contents access limited to exactly those three repositories' docs/local-development.md

          ! grep -Fq 'http://127.0.0.1:8080/readyz' .ores-compose.yaml
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.lock'
