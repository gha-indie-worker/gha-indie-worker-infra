name: Codespace edge contract

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.ores-compose.yaml'
      - 'config/codespaces-cluster.toml'
      - 'config/codespaces-cluster.rev'
      - 'config/ores-cli.rev'
      - 'config/ores-compose.rev'
      - 'Justfile'
      - 'scripts/dev/**'
      - 'tools/dev-runtime/**'
      - 'docs/local-development.md'
      - '.github/workflows/codespace-edge-contract.yml'
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.ores-compose.yaml'
      - 'config/codespaces-cluster.toml'
      - 'config/codespaces-cluster.rev'
      - 'config/ores-cli.rev'
      - 'config/ores-compose.rev'
      - 'Justfile'
      - 'scripts/dev/**'
      - 'tools/dev-runtime/**'
      - 'docs/local-development.md'
      - '.github/workflows/codespace-edge-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codespace-edge-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - name: Compile and run Rust contract tests
        run: cargo test --locked --manifest-path tools/dev-runtime/Cargo.toml
      - name: Run static contract validator
        run: cargo run --locked --manifest-path tools/dev-runtime/Cargo.toml -- validate
      - name: Check application and edge lifecycle contract
        shell: bash
        run: |
          set -euo pipefail

          ores_cli_rev="$(tr -d '[:space:]' < config/ores-cli.rev)"
          test "$ores_cli_rev" = 'd37aa4c1a0b79a292a31e2f16db8622144b0831f'
          [[ "$ores_cli_rev" =~ ^[0-9a-f]{40}$ ]]
          grep -Fq -- "--rev $ores_cli_rev" .devcontainer/devcontainer.json
          ! grep -Fq -- '--rev c854130ee147e9793a3af8736e90241630a5c934' .devcontainer/devcontainer.json

          ores_compose_rev="$(tr -d '[:space:]' < config/ores-compose.rev)"
          [[ "$ores_compose_rev" =~ ^[0-9a-f]{40}$ ]]
          test "$ores_compose_rev" != 'c52d08c875e73892acb88897c3b4a8969ad37ff2'
          grep -Fq -- "--rev $ores_compose_rev" .devcontainer/devcontainer.json
          ! grep -Fq -- '--rev c52d08c875e73892acb88897c3b4a8969ad37ff2' .devcontainer/devcontainer.json

          grep -Fq 'ORESoftware/codespaces-cluster' .devcontainer/devcontainer.json
          grep -Fq 'gh repo view ORESoftware/codespaces-cluster --json name' .devcontainer/devcontainer.json
          grep -Fq 'just codespace-edge-check' .devcontainer/devcontainer.json
          grep -Fq 'codespace-origin-up:' Justfile
          grep -Fq 'codespace-edge-up:' Justfile
          grep -Fq 'codespace-origin-status:' Justfile
          grep -Fq 'codespace-edge-status:' Justfile
          grep -Fq 'codespace-edge-down:' Justfile
          grep -Fq 'codespace-edge-check:' Justfile
          grep -Fq 'bash scripts/dev/codespace-origin-up' Justfile

          origin_up=scripts/dev/codespace-origin-up
          bash -n "$origin_up"
          grep -Fq 'GH_TOKEN="$token" gh repo clone ORESoftware/codespaces-cluster' "$origin_up"
          ! grep -Fq 'gh auth setup-git' "$origin_up"
          grep -Fq 'GIT_CONFIG_VALUE_1=!gh auth git-credential' "$origin_up"
          grep -Fq 'env "${git_auth_env[@]}" GH_TOKEN="$token"' "$origin_up"
          grep -Fq 'git -C "$cluster_root" fetch --no-tags origin "$revision"' "$origin_up"
          grep -Fq 'ORES_CLI_READ_TOKEN="$token" just codespace-edge-bootstrap' "$origin_up"
          grep -Fq 'gh auth token' "$origin_up"
          ! grep -Fq 'export GH_TOKEN=' "$origin_up"
          ! grep -Fq 'GH_TOKEN="$token" ORES_CODESPACES_CLUSTER_' "$origin_up"
          ! grep -Fq 'GH_TOKEN="$token" CODESPACES_CLUSTER_CONFIG=' "$origin_up"
          grep -Fq 'ORES_CODESPACES_CLUSTER_STATE_DIR=.ores/codespaces-cluster-app' "$origin_up"
          grep -Fq 'ORES_CODESPACES_CLUSTER_READY_PORT=18091' "$origin_up"
          grep -Fq 'CODESPACES_CLUSTER_CONFIG="$repo_root/config/codespaces-cluster.toml"' "$origin_up"
          grep -Fq 'http://127.0.0.1:8080/api/readyz' "$origin_up"
          grep -Fq '"onAutoForward": "ignore"' .devcontainer/devcontainer.json

          rev="$(tr -d '[:space:]' < config/codespaces-cluster.rev)"
          test "$rev" = 'fe61abec77af464dd31944f6bf1fdd6ddfd0a65c'
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]]

          cfg=config/codespaces-cluster.toml
          test -s "$cfg"
          grep -Fq 'listen = "127.0.0.1:8080"' "$cfg"
          grep -Fq 'prefix = "/api"' "$cfg"
          grep -Fq 'upstream = "http://127.0.0.1:18090"' "$cfg"
          grep -Fq 'prefix = "/"' "$cfg"
          grep -Fq 'upstream = "http://127.0.0.1:18091"' "$cfg"
          test "$(grep -Fc 'required = true' "$cfg")" -eq 2

          grep -Fq 'API: `127.0.0.1:18090`' docs/local-development.md
          grep -Fq 'web: `127.0.0.1:18091`' docs/local-development.md
          grep -Fq 'Port `8080` is reserved exclusively' docs/local-development.md
          grep -Fq 'read-only Contents access limited to exactly those three repositories' docs/local-development.md
          grep -Fq 'codespace-origin-up' docs/local-development.md
          grep -Fq "$ores_cli_rev" docs/local-development.md
          grep -Fq "$ores_compose_rev" docs/local-development.md
          grep -Fq "$rev" docs/local-development.md
          ! grep -Fq 'c52d08c875e73892acb88897c3b4a8969ad37ff2' docs/local-development.md

          ! grep -Fq 'http://127.0.0.1:8080/readyz' .ores-compose.yaml
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.lock'
