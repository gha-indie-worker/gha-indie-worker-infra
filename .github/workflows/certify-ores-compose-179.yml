name: certify ores-compose #179 exact head

on:
  pull_request:
    paths:
      - '.github/workflows/certify-ores-compose-179.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-ores-compose-179-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_ORES_COMPOSE_SHA: 71d82aad5665956717096238335116c1b8f7f077
      EXPECTED_BASE_SHA: b0134dca90af18d642a331603b0538f3964967a1
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout certification harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: cert-harness
          persist-credentials: false
          submodules: false

      - name: Checkout exact ores-compose candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.EXPECTED_ORES_COMPOSE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-compose
          persist-credentials: false
          fetch-depth: 64

      - name: Assert exact candidate and one-file review surface
        shell: bash
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ORES_COMPOSE_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          test "$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | sort | tr '\n' ' ')" = 'tests/formal_dependency_graph_exhaustive.rs '
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          test -z "$(git status --porcelain)"

      - name: Configure private Cargo Git reads
        shell: bash
        working-directory: ores-compose
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          gh auth setup-git

      - name: Install reviewed Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'

      - name: Prepare exact base worktree
        shell: bash
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          git worktree add --detach /tmp/ores-compose-base "$EXPECTED_BASE_SHA"
          test "$(git -C /tmp/ores-compose-base rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          test -z "$(git -C /tmp/ores-compose-base status --porcelain)"

      - name: Changed-file formatting
        shell: bash
        working-directory: ores-compose
        run: rustfmt --edition 2024 --check tests/formal_dependency_graph_exhaustive.rs

      - name: Locked all-target all-feature compile
        shell: bash
        working-directory: ores-compose
        run: cargo check --locked --all-targets --all-features

      - name: Exhaustive dependency-wave proof
        shell: bash
        working-directory: ores-compose
        run: cargo test --locked --test formal_dependency_graph_exhaustive -- --nocapture

      - name: Compare full-suite failures with exact base
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          (cd ores-compose && cargo test --locked --all-targets --all-features --no-fail-fast) > /tmp/head-tests.log 2>&1
          head_rc=$?
          (cd /tmp/ores-compose-base && cargo test --locked --all-targets --all-features --no-fail-fast) > /tmp/base-tests.log 2>&1
          base_rc=$?
          set -e
          export HEAD_RC="$head_rc" BASE_RC="$base_rc"
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          failed = re.compile(r'^test (.+) \.\.\. FAILED$')
          def failures(path):
              out=set()
              for line in Path(path).read_text(errors='replace').splitlines():
                  m=failed.match(line.strip())
                  if m:
                      out.add(m.group(1))
              return out

          base=failures('/tmp/base-tests.log')
          head=failures('/tmp/head-tests.log')
          new=sorted(head-base)
          print(f"full-suite exit base={os.environ['BASE_RC']} head={os.environ['HEAD_RC']}")
          print(f"failed tests base={len(base)} head={len(head)} new={len(new)}")
          for name in new:
              print(f"NEW FAILURE: {name}")
          if int(os.environ['BASE_RC']) == 0:
              assert int(os.environ['HEAD_RC']) == 0, 'candidate regressed a green base suite'
          assert not new, 'candidate introduced full-suite test failures'
          PY

      - name: Compare strict Clippy diagnostics with exact base
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          (cd ores-compose && cargo clippy --locked --all-targets --all-features --message-format=json -- -D warnings) > /tmp/head-clippy.jsonl 2>/tmp/head-clippy.stderr
          head_rc=$?
          (cd /tmp/ores-compose-base && cargo clippy --locked --all-targets --all-features --message-format=json -- -D warnings) > /tmp/base-clippy.jsonl 2>/tmp/base-clippy.stderr
          base_rc=$?
          set -e
          export HEAD_RC="$head_rc" BASE_RC="$base_rc"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          def norm_file(path):
              p=str(path or '').replace('\\','/')
              for marker in ('/ores-compose-base/','/ores-compose/'):
                  if marker in p:
                      return p.split(marker,1)[1]
              return p

          def diagnostics(path):
              out=set()
              for raw in Path(path).read_text(errors='replace').splitlines():
                  try:
                      row=json.loads(raw)
                  except Exception:
                      continue
                  if row.get('reason') != 'compiler-message':
                      continue
                  msg=row.get('message') or {}
                  if msg.get('level') not in ('warning','error'):
                      continue
                  code=(msg.get('code') or {}).get('code') or ''
                  spans=msg.get('spans') or []
                  primary=next((s for s in spans if s.get('is_primary')), spans[0] if spans else {})
                  out.add((code, msg.get('message') or '', norm_file(primary.get('file_name')),
                           primary.get('line_start') or 0, primary.get('column_start') or 0))
              return out

          base=diagnostics('/tmp/base-clippy.jsonl')
          head=diagnostics('/tmp/head-clippy.jsonl')
          new=sorted(head-base)
          print(f"clippy exit base={os.environ['BASE_RC']} head={os.environ['HEAD_RC']}")
          print(f"diagnostics base={len(base)} head={len(head)} new={len(new)}")
          for item in new:
              print('NEW CLIPPY:', item)
          if int(os.environ['BASE_RC']) == 0:
              assert int(os.environ['HEAD_RC']) == 0, 'candidate regressed green strict Clippy'
          assert not new, 'candidate introduced strict Clippy diagnostics'
          PY

      - name: Assert immutable candidate and base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ores-compose rev-parse HEAD)" = "$EXPECTED_ORES_COMPOSE_SHA"
          test "$(git -C /tmp/ores-compose-base rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          test -z "$(git -C ores-compose status --porcelain)"
          test -z "$(git -C /tmp/ores-compose-base status --porcelain)"
