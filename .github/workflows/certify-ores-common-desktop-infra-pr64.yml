name: certify common desktop release activation PR 64

on:
  pull_request:
    paths:
      - '.github/workflows/certify-ores-common-desktop-infra-pr64.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-common-desktop-infra-pr64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact common desktop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-common-desktop-infra
          ref: 0ccaf83d32fb5bf901dce9b056f660028667d9af
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
          show-progress: false
          fetch-depth: 1
      - name: Verify exact source and review surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "0ccaf83d32fb5bf901dce9b056f660028667d9af"
          git -C source diff --check
          test -f source/daemon/rust/src/hot_reload_policy.rs
      - name: Install declared Rust toolchain
        shell: bash
        run: rustup toolchain install 1.82.0 --profile minimal --component rustfmt,clippy
      - name: Verify formatting and locked daemon build/tests
        working-directory: source
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.ORE_SOURCE_PAT }}@github.com/.insteadOf'
          GIT_CONFIG_VALUE_0: 'https://github.com/'
        shell: bash
        run: |
          set -euo pipefail
          rustfmt +1.82.0 --edition 2021 --check daemon/rust/src/hot_reload_policy.rs
          cargo +1.82.0 check --locked -p ores-common-desktop-daemon --all-targets
          cargo +1.82.0 test --locked -p ores-common-desktop-daemon hot_reload_policy
      - name: Strict daemon Clippy and immutable-source proof
        working-directory: source
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.ORE_SOURCE_PAT }}@github.com/.insteadOf'
          GIT_CONFIG_VALUE_0: 'https://github.com/'
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.82.0 clippy --locked -p ores-common-desktop-daemon --all-targets -- -D warnings -A clippy::needless-return
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "0ccaf83d32fb5bf901dce9b056f660028667d9af"
