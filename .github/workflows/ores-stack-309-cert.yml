name: ores-stack 309 exact-head certification

on:
  push:
    branches:
      - ci/certify-ores-stack-309-20260928
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-stack-309-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-188:
    name: ores-stack CLI compatibility (Rust 1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact ores-stack PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-stack
          ref: 82bf7281e73497f2913a3e4afbb7c6098e3d88ed
          token: ${{ secrets.ORES_STACK_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "82bf7281e73497f2913a3e4afbb7c6098e3d88ed"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo +1.88.0 fmt --all -- --check
      - name: Compile ores-stack CLI
        run: cargo +1.88.0 check --locked -p ores-stack-cli --bin ores-stack
      - name: Run ores-stack CLI tests
        run: cargo +1.88.0 test --locked -p ores-stack-cli --bin ores-stack
