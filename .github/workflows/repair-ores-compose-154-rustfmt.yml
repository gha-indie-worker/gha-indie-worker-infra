name: repair ores-compose 154 rustfmt

on:
  pull_request:
    paths:
      - '.github/workflows/repair-ores-compose-154-rustfmt.yml'

permissions:
  contents: read

jobs:
  repair:
    if: github.head_ref == 'ci/certify-ore-exact-heads-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ba2657a0e852108df72e20edca2d4ec46ac6447f
      SOURCE_BRANCH: feat/service-environment-isolation
    steps:
      - name: Checkout exact source head with scoped token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: subject
          persist-credentials: true
          fetch-depth: 1
      - name: Assert exact source identity
        working-directory: subject
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Install reviewed Rust toolchain
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'
      - name: Apply rustfmt
        working-directory: subject
        run: cargo fmt --all
      - name: Constrain formatter delta to PR-owned Rust files
        working-directory: subject
        run: |
          set -Eeuo pipefail
          allowed='^src/(config_loader|local_up_process|service_environment)\.rs$'
          changed="$(git diff --name-only)"
          test -n "$changed" || { echo 'rustfmt produced no delta'; exit 0; }
          while IFS= read -r path; do
            printf '%s\n' "$path" | grep -Eq "$allowed" || {
              echo "refusing unrelated rustfmt change: $path" >&2
              exit 1
            }
          done <<< "$changed"
          git diff --check
      - name: Commit formatting repair
        working-directory: subject
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git add src/config_loader.rs src/local_up_process.rs src/service_environment.rs
          git commit -m 'style: apply rustfmt to service environment changes'
      - name: Push fast-forward-only to source PR branch
        working-directory: subject
        run: |
          set -Eeuo pipefail
          if test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"; then exit 0; fi
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
