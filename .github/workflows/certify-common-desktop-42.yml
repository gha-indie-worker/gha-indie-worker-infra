name: certify common desktop #42

on:
  pull_request:
    paths:
      - '.github/workflows/certify-common-desktop-42.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-common-desktop-42-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: 7d62c6f57e96f2a45befe67a66a156e6d35cd4e1
      EXPECTED_BASE_SHA: e317a089248e81f161e9b4472bf838f7221e48a2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact reconciled runtime-generation candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-common-desktop-infra
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: common-desktop
          persist-credentials: false
          fetch-depth: 64

      - name: Assert exact current-main review surface
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          mapfile -t files < <(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD)
          test "${#files[@]}" -eq 20
          printf '%s\n' "${files[@]}" | grep -Fx 'Cargo.toml'
          test "$(printf '%s\n' "${files[@]}" | grep -Ec '^(runtime-generation/|runtime/contracts/|runtime/conformance/|docs/runtime-(generation|activation)-contract\.md$)')" -eq 19
          ! printf '%s\n' "${files[@]}" | grep -Eq '^(daemon/|desktop-app/|flutter/|ingress/|packaging/|router/)'

      - name: Configure private Cargo Git reads
        working-directory: common-desktop
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: gh auth setup-git

      - name: Install pinned Rust
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt,clippy
          rustup default 1.82.0
          rustc --version | grep -F 'rustc 1.82.0'

      - name: Verify committed formatting
        working-directory: common-desktop
        run: cargo fmt --all -- --check

      - name: Generate post-merge lock candidate
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          cp Cargo.lock "${RUNNER_TEMP}/common-desktop-42-Cargo.lock.before"
          cargo generate-lockfile
          cp Cargo.lock "${RUNNER_TEMP}/common-desktop-42-Cargo.lock"
          sha256sum Cargo.lock | tee "${RUNNER_TEMP}/common-desktop-42-cargo-lock.sha256"
          if ! cmp -s Cargo.lock "${RUNNER_TEMP}/common-desktop-42-Cargo.lock.before"; then
            echo 'reconciled workspace Cargo.lock is stale; exact generated lockfile uploaded as evidence' >&2
            exit 1
          fi

      - name: Upload lock candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: common-desktop-42-lock-${{ env.EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/common-desktop-42-Cargo.lock
            ${{ runner.temp }}/common-desktop-42-cargo-lock.sha256
          if-no-files-found: warn
          retention-days: 7

      - name: Locked workspace check
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo check --locked --workspace --all-targets

      - name: Strict Clippy except intentional explicit returns
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -A clippy::needless-return

      - name: Locked workspace tests
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test --locked --workspace --all-targets

      - name: Validate JSON contract fixtures
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e . runtime/contracts/runtime-generation.schema.json >/dev/null
          jq -e . runtime/contracts/runtime-activation.schema.json >/dev/null
          jq -e . runtime/contracts/instances/runtime-generation.valid.json >/dev/null
          jq -e . runtime/contracts/activation-instances/activation-intent.valid.json >/dev/null
          jq -e . runtime/conformance/fencing-retirement.v1.json >/dev/null
          jq -e . runtime/conformance/route-precedence.v1.json >/dev/null
          jq -e . runtime/conformance/transaction.v1.json >/dev/null

      - name: Restore source and assert immutability
        if: always()
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout -- Cargo.lock || true
          git clean -fd -- target
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
