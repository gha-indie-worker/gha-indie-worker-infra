name: certify ClaimGraph intelligence

on:
  pull_request:
    paths:
      - '.github/workflows/certify-claimgraph-intelligence.yml'

permissions:
  contents: read

jobs:
  regression:
    if: github.head_ref == 'ci/certify-claimgraph-intelligence-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: 11f3fd215bf66e5cabf05ba26ba7c4d6f7578856
      EXPECTED_BASE_SHA: 7e6bf255b9109b69b89a2d8959c71c6d9bb80341
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact ClaimGraph regression head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ClaimGraph/claimgraph-intelligence.rs
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: claimgraph-regression
          persist-credentials: false
          fetch-depth: 32

      - name: Assert exact source and scoped feature diff
        working-directory: claimgraph-regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test ! -e .github/workflows/tmp-regression-restricted-feature-hardening.yml
          test ! -e .github/tmp/regression-hardening-trigger.txt
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          mapfile -t files < <(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | grep -Fx 'src/lib.rs'
          printf '%s\n' "${files[@]}" | grep -Fx 'src/regression.rs'
          printf '%s\n' "${files[@]}" | grep -Fx 'tests/regression_restricted_feature_normalization.rs'

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy

      - name: Rustfmt
        working-directory: claimgraph-regression
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        working-directory: claimgraph-regression
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Full locked tests
        working-directory: claimgraph-regression
        run: cargo test --locked

      - name: Restricted-feature negative control
        working-directory: claimgraph-regression
        run: cargo test --locked --test regression_restricted_feature_normalization

      - name: Assert checkout stayed immutable
        if: always()
        working-directory: claimgraph-regression
        run: test -z "$(git status --porcelain)"
