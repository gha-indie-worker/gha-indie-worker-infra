name: certify ClaimGraph intelligence

on:
  pull_request:
    paths:
      - '.github/workflows/certify-claimgraph-intelligence.yml'

permissions:
  contents: read

jobs:
  fleet-conformance:
    if: github.head_ref == 'ci/certify-claimgraph-intelligence-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: 849e83ae3f6c669603dfc94d69a2c797688b2185
      EXPECTED_BASE_SHA: dbd9b22a24e532eda5c5ca97e435a5248da18f16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact ClaimGraph conformance head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ClaimGraph/claimgraph-intelligence.rs
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: claimgraph-conformance
          persist-credentials: false
          fetch-depth: 8
      - name: Assert exact source and scoped diff
        working-directory: claimgraph-conformance
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          mapfile -t files < <(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD)
          test "${#files[@]}" -eq 4
          printf '%s\n' "${files[@]}" | grep -Fx '.github/workflows/intelligence.yml'
          printf '%s\n' "${files[@]}" | grep -Fx '.gitignore'
          printf '%s\n' "${files[@]}" | grep -Fx '.zpkg.toml'
          printf '%s\n' "${files[@]}" | grep -Fx 'AGENTS.md'
      - name: Verify canonical package repository metadata
        working-directory: claimgraph-conformance
        shell: bash
        run: |
          set -Eeuo pipefail
          awk '
            $0 == "[package.repository]" { in_repo=1; next }
            /^\[/ && in_repo { exit }
            in_repo && $0 == "vcs = \"git\"" { vcs=1 }
            in_repo && $0 == "url = \"https://github.com/ClaimGraph/claimgraph-intelligence.rs\"" { url=1 }
            END { exit !(vcs && url) }
          ' .zpkg.toml
          grep -Fx '/target' .gitignore
          grep -Fx 'tmp/' .gitignore
          grep -Fx 'temp/' .gitignore
          grep -F 'persist-credentials: false' .github/workflows/intelligence.yml
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Rust gates
        working-directory: claimgraph-conformance
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Assert checkout stayed immutable
        if: always()
        working-directory: claimgraph-conformance
        run: test -z "$(git status --porcelain)"

  regression:
    if: github.head_ref == 'ci/certify-claimgraph-intelligence-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: 09e0616d832a55410889f847fcf933b444bdcaed
      EXPECTED_BASE_SHA: dbd9b22a24e532eda5c5ca97e435a5248da18f16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact ClaimGraph regression head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ClaimGraph/claimgraph-intelligence.rs
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: claimgraph-regression
          persist-credentials: false
          fetch-depth: 16
      - name: Assert exact source and no temporary mutable CI
        working-directory: claimgraph-regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test ! -e .github/workflows/tmp-regression-restricted-feature-hardening.yml
          test ! -e .github/tmp/regression-hardening-trigger.txt
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          mapfile -t files < <(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | grep -Fx 'src/lib.rs'
          printf '%s\n' "${files[@]}" | grep -Fx 'src/regression.rs'
          printf '%s\n' "${files[@]}" | grep -Fx 'tests/regression_restricted_feature_normalization.rs'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Rust gates
        working-directory: claimgraph-regression
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo test --locked --test regression_restricted_feature_normalization
      - name: Assert checkout stayed immutable
        if: always()
        working-directory: claimgraph-regression
        run: test -z "$(git status --porcelain)"
