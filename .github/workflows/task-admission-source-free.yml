name: Task admission source-free canary

on:
  push:
    branches:
      - "ci/task-admission-source-free-20261020"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Run source-free Task admission canary
        run: node --test tests/task-admission-source-free.test.mjs
