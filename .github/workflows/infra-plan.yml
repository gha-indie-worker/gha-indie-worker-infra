name: infra-plan

# Static validation only for the smaller independent state roots plus native contracts.
on:
  pull_request:
    paths:
      - "modules/**"
      - "environments/**"
      - "cloudflare/**"
      - "neon/**"
      - "supabase/**"
      - ".db-providers.json"
      - ".github/workflows/infra-plan.yml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
      - "cloudflare/**"
      - "neon/**"
      - "supabase/**"
      - ".github/workflows/infra-plan.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt-and-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - environments/production/cloudflare-dns
          - environments/production/gcp-cloudrun
          - environments/production/neon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.0
      - name: fmt
        run: tofu -chdir=${{ matrix.dir }} fmt -check -diff -recursive
      - name: init (no backend)
        run: tofu -chdir=${{ matrix.dir }} init -backend=false -input=false
      - name: validate
        run: tofu -chdir=${{ matrix.dir }} validate

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: .db-providers.json is valid JSON and planes are disjoint
        run: node scripts/check-db-providers.mjs
      - name: edge-router config matches schema
        working-directory: cloudflare/edge-router
        run: |
          npm install --no-audit --no-fund
          npm run validate

  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: infra-isolation
        run: npm ci --ignore-scripts && npm test
