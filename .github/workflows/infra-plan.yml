name: infra-plan

on:
  pull_request:
    paths:
      - "modules/**"
      - "environments/**"
      - "cloudflare/**"
      - "supabase/**"
      - "neon/**"
      - ".db-providers.json"
      - ".ores-infra.toml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
      - "cloudflare/**"
      - "supabase/**"
      - "neon/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt-and-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [gcp, cloudflare, neon, supabase]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.0
      - name: fmt environment
        run: tofu -chdir=environments/production/${{ matrix.provider }} fmt -check -diff -recursive
      - name: fmt module
        run: tofu fmt -check -diff -recursive modules/${{ matrix.provider }}
      - name: init (no backend)
        run: tofu -chdir=environments/production/${{ matrix.provider }} init -backend=false -input=false
      - name: validate
        run: tofu -chdir=environments/production/${{ matrix.provider }} validate
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-db-providers.mjs
      - name: edge-router config matches the schema
        working-directory: cloudflare/edge-router
        run: npm install --no-audit --no-fund && npm run validate
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: infra-isolation
        run: npm ci --ignore-scripts && npm test
