name: certify BeamScale lifecycle v2

on:
  pull_request:
    paths:
      - '.github/workflows/certify-beamscale-lifecycle-v2.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-beamscale-lifecycle-v2-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: 3b7814d34fc89d7aaec22c14d61175b86b256c49
      EXPECTED_BASE_SHA: 655168c912ce38b0699b14d039aee95d049fbbe3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact BeamScale lifecycle candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: beamscale/bmscl-infra
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 8

      - name: Assert exact lifecycle v2 change surface
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          test "$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | wc -l | tr -d ' ')" -eq 3
          git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | grep -Fx deploy/baremetal/nixos/bmscl-lifecycle-agent.nix
          git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | grep -Fx deploy/baremetal/process-lifecycle.md
          git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | grep -Fx scripts/check-lifecycle-agent-contract.mjs

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      - name: Parse exact NixOS lifecycle module
        working-directory: source
        run: nix-instantiate --parse deploy/baremetal/nixos/bmscl-lifecycle-agent.nix >/dev/null

      - name: Execute exact production lifecycle contract
        working-directory: source
        run: node scripts/check-lifecycle-agent-contract.mjs

      - name: Prove observe-only v2 carries no mutation authority
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          nix=deploy/baremetal/nixos/bmscl-lifecycle-agent.nix
          grep -Fq 'ORES_PROCESS_LIFECYCLE_CONFIG_VERSION = "v2"' "$nix"
          grep -Fq 'ORES_PROCESS_LIFECYCLE_EFFECTS = "observe"' "$nix"
          grep -Fq 'ORES_PROCESS_LIFECYCLE_LEASE_PROVIDER = "cloudflare-do"' "$nix"
          ! grep -Fq 'ORES_PROCESS_LIFECYCLE_EFFECTS = "freeze_thaw"' "$nix"
          ! grep -Fq 'ORES_PROCESS_LIFECYCLE_LEASE_ENDPOINT' "$nix"
          ! grep -Fq 'ORES_PROCESS_LIFECYCLE_CREDENTIAL_NAME' "$nix"
          ! grep -Fq 'LoadCredential' "$nix"
          ! grep -Fq 'CAP_SYS_ADMIN' "$nix"
          ! grep -Fq 'CAP_DAC_OVERRIDE' "$nix"
          ! grep -Fq 'CAP_SYS_PTRACE' "$nix"
          ! grep -Fq 'AF_INET' "$nix"
          ! grep -Fq 'AF_INET6' "$nix"

      - name: Assert source immutability
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
