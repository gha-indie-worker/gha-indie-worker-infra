name: certify common desktop #40

on:
  pull_request:
    paths:
      - '.github/workflows/certify-common-desktop-40.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-common-desktop-40-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: a159b409e7fafba8365f5c9f79c5b69dcde9a19a
      EXPECTED_BASE_SHA: 6c5a9d3dd3e58ab51274fc96addc4008f5d60ccb
      EXPECTED_LOCK_SHA256: 9bc7675b694b3aecec4a80b87f2913ff001081affbde10f141c20db5fd9bfa71
      EXPECTED_ROUTER_SHA256: 1ed4e74babbc13322364311021c1cf9d949d8f6cde38fb5a86ac4df4c2de0abe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact common desktop candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-common-desktop-infra
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: common-desktop
          persist-credentials: false
          fetch-depth: 64

      - name: Assert exact source and review surface
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          actual="$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | sort | tr '\n' ' ')"
          expected='Cargo.lock conformance/README.md conformance/rust/Cargo.toml conformance/rust/src/bin/validate_appliance_contract.rs daemon/rust/src/state.rs router/rust/src/lib.rs '
          test "$actual" = "$expected"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          test "$(sha256sum Cargo.lock | awk '{print $1}')" = "$EXPECTED_LOCK_SHA256"
          test "$(sha256sum router/rust/src/lib.rs | awk '{print $1}')" = "$EXPECTED_ROUTER_SHA256"

      - name: Configure private Cargo Git reads
        working-directory: common-desktop
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: gh auth setup-git

      - name: Install pinned Rust
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt,clippy
          rustup default 1.82.0
          rustc --version | grep -F 'rustc 1.82.0'

      - name: Check changed Rust formatting
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          rustfmt --edition 2021 --check conformance/rust/src/bin/validate_appliance_contract.rs
          rustfmt --edition 2021 --check daemon/rust/src/state.rs
          rustfmt --edition 2021 --check router/rust/src/lib.rs

      - name: Locked workspace check
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo check --locked --workspace --all-targets

      - name: Strict Clippy except intentional explicit returns
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -A clippy::needless-return

      - name: Locked workspace tests
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test --locked --workspace --all-targets

      - name: Validate fleet runtime contracts
        working-directory: common-desktop
        run: cargo run --locked -p ores-common-desktop-conformance --bin validate_runtime_contracts

      - name: Exercise appliance validator build boundary
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo build --locked -p ores-common-desktop-conformance --bin validate_appliance_contract
          test -x target/debug/validate_appliance_contract

      - name: Assert candidate remained immutable
        if: always()
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git clean -fd -- target
          test -z "$(git status --porcelain)"
