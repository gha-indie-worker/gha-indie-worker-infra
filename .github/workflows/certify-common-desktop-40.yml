name: certify common desktop #40

on:
  pull_request:
    paths:
      - '.github/workflows/certify-common-desktop-40.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-common-desktop-40-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: 752fc8e12a3ace8f375eaff1f37db44670d283fc
      EXPECTED_BASE_SHA: 6c5a9d3dd3e58ab51274fc96addc4008f5d60ccb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact common desktop candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-common-desktop-infra
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: common-desktop
          persist-credentials: false
          fetch-depth: 64

      - name: Assert exact source and review surface
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          actual="$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD | sort | tr '\n' ' ')"
          expected='conformance/README.md conformance/rust/Cargo.toml conformance/rust/src/bin/validate_appliance_contract.rs '
          test "$actual" = "$expected"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD

      - name: Configure private Cargo Git reads
        working-directory: common-desktop
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: gh auth setup-git

      - name: Install pinned Rust
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt,clippy
          rustup default 1.82.0
          rustc --version | grep -F 'rustc 1.82.0'

      - name: Check changed Rust formatting
        working-directory: common-desktop
        run: rustfmt --edition 2021 --check conformance/rust/src/bin/validate_appliance_contract.rs

      - name: Generate reviewed lock and router cleanup candidates
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(grep -Fxc '        let mut value = generation(1, \"main\");' router/rust/src/lib.rs)" -eq 1
          sed -i 's/        let mut value = generation(1, "main");/        let value = generation(1, "main");/' router/rust/src/lib.rs
          cargo generate-lockfile
          sha256sum Cargo.lock | tee "${RUNNER_TEMP}/common-desktop-cargo-lock.sha256"
          sha256sum router/rust/src/lib.rs | tee "${RUNNER_TEMP}/common-desktop-router-lib.sha256"
          cp Cargo.lock "${RUNNER_TEMP}/common-desktop-Cargo.lock"
          cp router/rust/src/lib.rs "${RUNNER_TEMP}/common-desktop-router-lib.rs"

      - name: Locked workspace check
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo check --locked --workspace --all-targets

      - name: Strict Clippy except intentional explicit returns
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -A clippy::needless-return

      - name: Locked workspace tests
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test --locked --workspace --all-targets

      - name: Validate fleet runtime contracts
        working-directory: common-desktop
        run: cargo run --locked -p ores-common-desktop-conformance --bin validate_runtime_contracts

      - name: Exercise appliance validator build boundary
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo build --locked -p ores-common-desktop-conformance --bin validate_appliance_contract
          test -x target/debug/validate_appliance_contract

      - name: Upload reviewed source candidates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: common-desktop-source-candidates-${{ env.EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/common-desktop-Cargo.lock
            ${{ runner.temp }}/common-desktop-cargo-lock.sha256
            ${{ runner.temp }}/common-desktop-router-lib.rs
            ${{ runner.temp }}/common-desktop-router-lib.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Restore source checkout
        if: always()
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout -- Cargo.lock router/rust/src/lib.rs
          git clean -fd -- target

      - name: Assert candidate remained immutable
        if: always()
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
