name: repair ores-compose machine JobState import

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/repair-ores-compose-machine-jobstate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-compose
  SOURCE_BRANCH: fix/machine-jobstate-test-import-20260922
  EXPECTED_MAIN_SHA: 2deb9229521acd66f9f14bf858ac6f78c734d106
  EXPECTED_BRANCH_SHA: 2deb9229521acd66f9f14bf858ac6f78c734d106
  NEXT_BASE_BRANCH: fix/source-filter-regression-current-main-20260922
  NEXT_BASE_SHA: 202171eaaad46f9f9f2684622c8e8574b998a88b
  NEXT_BASE_FILE: tests/source_filter_execution_regressions.rs

jobs:
  repair_certify_push:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Require scoped source credential
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Checkout exact untouched repair branch
        run: |
          set -Eeuo pipefail
          git clone --no-tags "https://github.com/${SOURCE_REPO}.git" ores-compose
          cd ores-compose
          git checkout "$SOURCE_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_BRANCH_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse "origin/$NEXT_BASE_BRANCH")" = "$NEXT_BASE_SHA"
          test "$(git diff --name-only "$EXPECTED_MAIN_SHA"..HEAD)" = ''
          test -z "$(git status --porcelain)"

      - name: Apply test-only import repair
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          grep -Fq 'EnqueueResult, GitRevision, JobId, JobRequest, JobSnapshot, JobState, QueueError,' src/machine.rs
          grep -Fq '    use crate::identity::RoutingLabel;' src/machine.rs
          sed -i 's/EnqueueResult, GitRevision, JobId, JobRequest, JobSnapshot, JobState, QueueError,/EnqueueResult, GitRevision, JobId, JobRequest, JobSnapshot, QueueError,/' src/machine.rs
          sed -i '/^    use crate::identity::RoutingLabel;$/a\    use crate::queue::JobState;' src/machine.rs
          test "$(git diff --name-only | tr '\n' ' ')" = 'src/machine.rs '
          git diff --check

      - name: Install Rust 1.98.1
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'

      - name: Format only repaired file
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          rustfmt --edition 2024 src/machine.rs
          test "$(git diff --name-only | tr '\n' ' ')" = 'src/machine.rs '
          git diff --check
          rustfmt --edition 2024 --check src/machine.rs

      - name: Overlay exact #178 future baseline for certification only
        working-directory: ores-compose
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse "origin/$NEXT_BASE_BRANCH")" = "$NEXT_BASE_SHA"
          git show "$NEXT_BASE_SHA:$NEXT_BASE_FILE" > "$NEXT_BASE_FILE"
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'src/machine.rs tests/source_filter_execution_regressions.rs '
          rustfmt --edition 2024 --check "$NEXT_BASE_FILE"
          git diff --check

      - name: Locked all-target all-feature compile on future baseline
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          set -Eeuo pipefail
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo check --locked --all-targets --all-features

      - name: Locked all-target all-feature tests on future baseline
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test --locked --all-targets --all-features

      - name: Strict locked Clippy on future baseline
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Restore certification overlay and push only machine repair
        working-directory: ores-compose
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          git checkout HEAD -- "$NEXT_BASE_FILE"
          test "$(git diff --name-only | tr '\n' ' ')" = 'src/machine.rs '
          git diff --check
          test -z "$(git diff --name-only -- Cargo.lock)"
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          remote_branch=$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)
          remote_next=$(git ls-remote origin "refs/heads/$NEXT_BASE_BRANCH" | cut -f1)
          test "$remote_main" = "$EXPECTED_MAIN_SHA"
          test "$remote_branch" = "$EXPECTED_BRANCH_SHA"
          test "$remote_next" = "$NEXT_BASE_SHA"
          git config user.name 'ORESoftware CI certification'
          git config user.email 'noreply@oresoftware.com'
          git add src/machine.rs
          test "$(git diff --cached --name-only)" = 'src/machine.rs'
          git commit -m 'fix(machine): scope JobState import to tests'
          git push origin HEAD:"$SOURCE_BRANCH"
          echo ORES_COMPOSE_MACHINE_JOBSTATE_REPAIR_PASS
