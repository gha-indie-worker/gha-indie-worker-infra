name: local runtime static contract

on:
  pull_request:
    paths:
      - ".ores-compose.yaml"
      - ".gitmodules"
      - "_apps/gha-monorepo"
      - ".gitignore"
      - "scripts/dev/**"
      - "tools/dev-runtime/**"
      - "cloudflare/laptop-ingress/**"
      - "cloudflare/codespace-ingress/**"
      - ".devcontainer/**"
      - "docs/local-development.md"
      - ".github/workflows/local-runtime-contract.yml"
  push:
    branches: [main]
    paths:
      - ".ores-compose.yaml"
      - "_apps/gha-monorepo"
      - "scripts/dev/**"
      - "tools/dev-runtime/**"
      - "cloudflare/codespace-ingress/**"
      - ".devcontainer/**"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - name: Exact source / gitlink parity
        run: cargo run --locked --manifest-path tools/dev-runtime/Cargo.toml -- validate

  certify-ores-stack-215:
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/ores-stack-215-direct-only-cert-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact ores-stack candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-stack
          ref: ced8858009d2e8d99f6e6243f2c5318a6f6abe19
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-stack
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact candidate
        working-directory: ores-stack
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "ced8858009d2e8d99f6e6243f2c5318a6f6abe19"
          git diff --check

      - name: Install ores-stack MSRV
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0

      - name: Bootstrap deterministic workspace lock
        working-directory: ores-stack
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -Eeuo pipefail
          gh auth setup-git
          bash scripts/bootstrap-cargo-lock.sh ensure
          cargo metadata --locked --no-deps >/dev/null

      - name: Check formatting
        id: fmt
        continue-on-error: true
        working-directory: ores-stack
        run: cargo fmt --all -- --check

      - name: Materialize rustfmt delta
        if: steps.fmt.outcome == 'failure'
        working-directory: ores-stack
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all
          git diff -- . > ../rustfmt.diff
          git diff --name-only > ../rustfmt-files.txt

      - name: Upload rustfmt delta
        if: steps.fmt.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ores-stack-215-rustfmt-delta
          path: |
            rustfmt.diff
            rustfmt-files.txt
          if-no-files-found: error

      - name: Refuse formatting drift
        if: steps.fmt.outcome == 'failure'
        run: exit 1

      - name: Check ores-stack-core
        working-directory: ores-stack
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo check --locked -p ores-stack-core --all-targets

      - name: Focused execution-leaf tests
        working-directory: ores-stack
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo test --locked -p ores-stack-core lambda_execution_leaf_plan -- --nocapture

      - name: Clippy ores-stack-core
        working-directory: ores-stack
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo clippy --locked -p ores-stack-core --all-targets -- -D warnings

      - name: Preserve exact source
        working-directory: ores-stack
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "ced8858009d2e8d99f6e6243f2c5318a6f6abe19"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
