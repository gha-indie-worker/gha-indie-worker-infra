name: local runtime static contract

on:
  pull_request:
    paths:
      - ".ores-compose.yaml"
      - ".gitmodules"
      - "_apps/gha-monorepo"
      - ".gitignore"
      - "scripts/dev/**"
      - "tools/dev-runtime/**"
      - "cloudflare/laptop-ingress/**"
      - "cloudflare/codespace-ingress/**"
      - ".devcontainer/**"
      - "docs/local-development.md"
      - ".github/workflows/local-runtime-contract.yml"
  push:
    branches: [main]
    paths:
      - ".ores-compose.yaml"
      - "_apps/gha-monorepo"
      - "scripts/dev/**"
      - "tools/dev-runtime/**"
      - "cloudflare/codespace-ingress/**"
      - ".devcontainer/**"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - name: Exact source / gitlink parity
        run: cargo run --locked --manifest-path tools/dev-runtime/Cargo.toml -- validate

  patch-current-server-stream-ppr:
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/ores-stack-pr162-cert-20260921'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      head_sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Checkout current server-stream PPR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-stack
          ref: feat/server-stream-lambda-ppr-20260921
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0
      - name: Configure private Git authentication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          gh auth setup-git
          git config user.name 'ORESoftware automation'
          git config user.email 'noreply@oresoftware.com'
      - name: Admit the routes transport container
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! grep -Fq 'relative == Path::new("mod.rs")' crates/ores-stack-core/src/rpc_publication.rs; then
            git cherry-pick dc2f3b339520be369f9e2426ebe9d2c6b1098d69
          fi
      - name: Make handlers scanner server-stream-shape aware
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ores-stack-core/src/rpc_source_v2.rs')
          text = path.read_text()

          old_start = '        let (response, error) = result_types(&function.sig.output).ok_or_else(|| {'
          replacement = '''        let (response, error) = operation_result_types(
              &function.sig.output,
              &meta,
              &path_display,
              &function.sig.ident.to_string(),
          )?;\n'''
          if 'let (response, error) = operation_result_types(' not in text:
              start = text.find(old_start)
              if start < 0:
                  raise SystemExit('rpc_source_v2: unary return-shape anchor missing')
              end_marker = '        let name = function.sig.ident.to_string();'
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit('rpc_source_v2: post-return-shape anchor missing')
              text = text[:start] + replacement + text[end:]

          helper_marker = 'fn result_types(output: &ReturnType) -> Option<(String, String)> {'
          helper = r'''fn operation_result_types(
              output: &ReturnType,
              meta: &OperationMeta,
              path: &str,
              name: &str,
          ) -> Result<(String, String), RpcSourceError> {
              match meta.stream.as_str() {
                  "unary" => result_types(output).ok_or_else(|| {
                      RpcSourceError::Contract(format!(
                          "{path}: {name} is unary and must return Result<Success, Error>"
                      ))
                  }),
                  "server_stream" => {
                      let return_spec = single_generic_type(output, "ServerStreamResult").ok_or_else(|| {
                          RpcSourceError::Contract(format!(
                              "{path}: {name} uses stream = \\"server_stream\\" and must return ServerStreamResult<OperationSpec>"
                          ))
                      })?;
                      if normalize_type(&return_spec) != normalize_type(&meta.spec) {
                          return Err(RpcSourceError::Contract(format!(
                              "{path}: {name} returns ServerStreamResult<{return_spec}> but #[ores_operation] declares spec {}",
                              meta.spec
                          )));
                      }
                      Ok((
                          format!("<{} as ::ores_api_docs::OperationSpec>::ResponseBody", meta.spec),
                          format!("<{} as ::ores_api_docs::OperationSpec>::Error", meta.spec),
                      ))
                  }
                  "client_stream" | "bidi" => Err(RpcSourceError::Contract(format!(
                      "{path}: {name} uses unsupported Rust handler stream mode {:?}; ores-stack currently admits unary and server_stream only",
                      meta.stream
                  ))),
                  other => Err(RpcSourceError::Contract(format!(
                      "{path}: {name} uses unknown stream mode {other:?}"
                  ))),
              }
          }

          fn single_generic_type(output: &ReturnType, expected: &str) -> Option<String> {
              let ReturnType::Type(_, ty) = output else {
                  return None;
              };
              let Type::Path(path) = ty.as_ref() else {
                  return None;
              };
              let segment = path.path.segments.last()?;
              if segment.ident != expected {
                  return None;
              }
              let PathArguments::AngleBracketed(arguments) = &segment.arguments else {
                  return None;
              };
              let types = type_arguments(arguments);
              (types.len() == 1).then(|| types[0].clone())
          }

          '''
          if 'fn operation_result_types(' not in text:
              index = text.find(helper_marker)
              if index < 0:
                  raise SystemExit('rpc_source_v2: result_types helper anchor missing')
              text = text[:index] + helper + text[index:]

          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
      - name: Commit source hardening
        id: head
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! git diff --quiet; then
            git add crates/ores-stack-core/src/rpc_source_v2.rs
            git commit -m 'fix(rpc): require typed server-stream handler returns'
          fi
          git push origin HEAD:feat/server-stream-lambda-ppr-20260921
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  certify-current-server-stream-ppr:
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/ores-stack-pr162-cert-20260921'
    needs: patch-current-server-stream-ppr
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact patched ores-stack head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-stack
          ref: ${{ needs.patch-current-server-stream-ppr.outputs.head_sha }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
      - name: Configure private Git dependency authentication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          gh auth setup-git
      - name: Install ores-stack MSRV
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Bootstrap deterministic workspace lock
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -Eeuo pipefail
          bash scripts/bootstrap-cargo-lock.sh ensure
          cargo metadata --locked --no-deps >/dev/null
      - name: Compile unary and real v6 server-stream generated dispatchers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -Eeuo pipefail
          cargo test --locked -p ores-stack-core \
            --test rpc_generated_tree_compiles \
            --test rpc_server_stream_generated_tree_compiles
      - name: Build ores-stack CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -Eeuo pipefail
          cargo build --locked -p ores-stack-cli --bin ores-stack
      - name: Prove relay is incrementally chunked
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 5m bash scripts/ppr-stream-e2e-smoke.sh
