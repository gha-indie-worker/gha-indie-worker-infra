name: local runtime static contract

on:
  pull_request:
    paths:
      - ".ores-compose.yaml"
      - ".gitmodules"
      - "_apps/gha-monorepo"
      - ".gitignore"
      - "scripts/dev/**"
      - "tools/dev-runtime/**"
      - "cloudflare/laptop-ingress/**"
      - "cloudflare/codespace-ingress/**"
      - ".devcontainer/**"
      - "docs/local-development.md"
      - ".github/workflows/local-runtime-contract.yml"
  push:
    branches: [main]
    paths:
      - ".ores-compose.yaml"
      - "_apps/gha-monorepo"
      - "scripts/dev/**"
      - "tools/dev-runtime/**"
      - "cloudflare/codespace-ingress/**"
      - ".devcontainer/**"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - name: Exact source / gitlink parity
        run: cargo run --locked --manifest-path tools/dev-runtime/Cargo.toml -- validate

  repair-ores-stack-215-format:
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/ores-stack-215-direct-only-cert-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact ores-stack candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-stack
          ref: ced8858009d2e8d99f6e6243f2c5318a6f6abe19
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-stack
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact candidate
        working-directory: ores-stack
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "ced8858009d2e8d99f6e6243f2c5318a6f6abe19"
          git diff --check

      - name: Install Rust 1.88 rustfmt
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0

      - name: Format only the #215 source file
        working-directory: ores-stack
        shell: bash
        run: |
          set -Eeuo pipefail
          rustfmt --edition 2021 crates/ores-stack-core/src/lambda_execution_leaf_plan.rs
          git diff --check
          test "$(git diff --name-only)" = "crates/ores-stack-core/src/lambda_execution_leaf_plan.rs"

      - name: Commit source-local formatting repair
        working-directory: ores-stack
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          gh auth setup-git
          git config user.name 'ORESoftware automation'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-core/src/lambda_execution_leaf_plan.rs
          git commit -m 'style(lambda): rustfmt direct-only execution plan repair'
          git push origin HEAD:fix/lambda-execution-direct-only-semantics-20260922
