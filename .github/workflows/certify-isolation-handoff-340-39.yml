name: certify isolation handoff #340/current-main

on:
  pull_request:
    paths:
      - '.github/workflows/certify-isolation-handoff-340-39.yml'

permissions:
  contents: read

jobs:
  compose:
    if: github.head_ref == 'ci/certify-isolation-handoff-340-39-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: e7b77e086984912ebf8e8ddecd46919973cacda6
      EXPECTED_BASE_SHA: 783972f097324c47ccc4a77c376e8a006198dc07
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact ores-compose candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-compose
          persist-credentials: false
          fetch-depth: 16
      - name: Assert exact one-file security surface
        working-directory: ores-compose
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          test "$(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD)" = 'src/local_up_process.rs'
          grep -Fq 'const TRUSTED_ISOLATION_POLICY_ROOT: &str = "/tmp";' src/local_up_process.rs
          grep -Fq '.arg("--config-sha256")' src/local_up_process.rs
      - name: Configure private Cargo Git reads
        working-directory: ores-compose
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: gh auth setup-git
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'
      - name: Prove touched compose file is rustfmt-clean
        working-directory: ores-compose
        shell: bash
        run: |
          set -Eeuo pipefail
          cp src/local_up_process.rs "${RUNNER_TEMP}/local_up_process.rs.before"
          cargo fmt --all
          cmp src/local_up_process.rs "${RUNNER_TEMP}/local_up_process.rs.before"
          git checkout -- .
      - name: Locked compose check
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo check --locked --all-targets --all-features
      - name: Locked compose tests
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test --locked --all-targets --all-features --no-fail-fast
      - name: Locked compose strict Clippy
        working-directory: ores-compose
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Assert immutable compose source
        if: always()
        working-directory: ores-compose
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout -- .
          git clean -fd -- target
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

  consumer-current-main:
    if: github.head_ref == 'ci/certify-isolation-handoff-340-39-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: a32a7d638497bddc2478019f9c5cde156b248760
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact current proc-isolation main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-proc-isolation-cli
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: proc-isolation
          persist-credentials: false
          fetch-depth: 8
      - name: Assert exact current source and retained handoff regression
        working-directory: proc-isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check HEAD
          test -f Cargo.lock
          test -f tests/compose_policy_digest_handoff.rs
          grep -Fq '.arg("--target-env-stdin")' tests/compose_policy_digest_handoff.rs
          grep -Fq '.arg("--config-sha256")' tests/compose_policy_digest_handoff.rs
          grep -Fq 'policy SHA-256 does not match the expected handoff digest' tests/compose_policy_digest_handoff.rs
      - name: Configure private Cargo Git reads
        working-directory: proc-isolation
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: gh auth setup-git
      - name: Install MSRV Rust
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
          rustc --version | grep -F 'rustc 1.88.0'
      - name: Generate deterministic current-main lock candidate
        id: lock
        working-directory: proc-isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          cp Cargo.lock "${RUNNER_TEMP}/ores-proc-isolation-current-main-Cargo.lock.before"
          cargo generate-lockfile
          cp Cargo.lock "${RUNNER_TEMP}/ores-proc-isolation-current-main-Cargo.lock"
          sha256sum Cargo.lock | tee "${RUNNER_TEMP}/ores-proc-isolation-current-main-Cargo.lock.sha256"
          git diff -- Cargo.lock > "${RUNNER_TEMP}/ores-proc-isolation-current-main-Cargo.lock.patch"
          if cmp -s Cargo.lock "${RUNNER_TEMP}/ores-proc-isolation-current-main-Cargo.lock.before"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Prove current Rust source is rustfmt-clean
        working-directory: proc-isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all
          git diff --exit-code -- ':(glob)**/*.rs'
      - name: Locked current-main check with generated lock
        working-directory: proc-isolation
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo check --locked --all-targets
      - name: Locked current-main tests with generated lock
        working-directory: proc-isolation
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test --locked --all-targets --no-fail-fast
      - name: Locked current-main strict Clippy with generated lock
        working-directory: proc-isolation
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Upload deterministic current-main lock evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ores-proc-isolation-current-main-lock-${{ env.EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/ores-proc-isolation-current-main-Cargo.lock
            ${{ runner.temp }}/ores-proc-isolation-current-main-Cargo.lock.sha256
            ${{ runner.temp }}/ores-proc-isolation-current-main-Cargo.lock.patch
          if-no-files-found: warn
          retention-days: 7
      - name: Report whether committed lock was stale
        if: always()
        shell: bash
        run: echo "current-main-lock-changed=${{ steps.lock.outputs.changed }}"
      - name: Restore and assert immutable current source
        if: always()
        working-directory: proc-isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout -- .
          git clean -fd -- target
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
