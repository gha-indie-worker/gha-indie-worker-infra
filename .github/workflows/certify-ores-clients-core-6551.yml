name: repair and certify ores-clients-core 6551 exact head

on:
  push:
    branches:
      - ci/certify-ores-clients-core-6551-20260922
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_BRANCH: feat/contracts-conformance-tooling
  SUBJECT_SHA: 6551be4b4358d7bb83be5f43142130556fa87fad
  MAIN_SHA: 0ec44067a94af0f859209132c342cff45bd2c25b

jobs:
  repair-certify-and-fast-forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout proof harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-clients-core
          ref: ${{ env.SUBJECT_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: subject
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source and configure guarded push
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C subject rev-parse HEAD)" = "$SUBJECT_SHA"
          test -z "$(git -C subject status --porcelain)"
          test -n "${ORE_SOURCE_PAT:-}"
          git -C subject config user.name ORESoftware
          git -C subject config user.email alex@oresoftware.com
          git -C subject remote set-url origin "https://x-access-token:${ORE_SOURCE_PAT}@github.com/ORESoftware/ores-clients-core.git"
          test "$(git -C subject ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git -C subject ls-remote origin "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')" = "$SUBJECT_SHA"
          git -C subject merge-base --is-ancestor "$MAIN_SHA" "$SUBJECT_SHA"

      - name: Apply narrow Clippy refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/repair-ores-clients-core-1.py subject
          test "$(git -C subject diff --name-only | sort)" = $'src/lib.rs\nsrc/render.rs'

      - name: Install source CI Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy

      - name: Format repair and commit
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only | sort)" = $'src/lib.rs\nsrc/render.rs'
          git add src/lib.rs src/render.rs
          git commit -m 'fix: satisfy strict client tooling clippy'

      - name: Strict Clippy
        working-directory: subject
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: subject
        run: cargo test --all-targets --all-features

      - name: Verify and fast-forward only admitted branch
        working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          git diff --exit-code
          git diff --check "$MAIN_SHA"...HEAD
          CURRENT_REMOTE="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')"
          test "$CURRENT_REMOTE" = "$SUBJECT_SHA"
          git push origin "HEAD:refs/heads/${SOURCE_BRANCH}"
