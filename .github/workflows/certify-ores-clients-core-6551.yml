name: certify ores-clients-core 6551 exact head

on:
  push:
    branches:
      - ci/certify-ores-clients-core-6551-20260922
  workflow_dispatch:

permissions:
  contents: read

env:
  SUBJECT_SHA: 6551be4b4358d7bb83be5f43142130556fa87fad

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-clients-core
          ref: ${{ env.SUBJECT_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: subject
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C subject rev-parse HEAD)" = "$SUBJECT_SHA"
          test -z "$(git -C subject status --porcelain)"

      - name: Install source CI Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy

      - name: Rust format
        working-directory: subject
        run: cargo fmt --all -- --check

      - name: Rust Clippy
        working-directory: subject
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: subject
        run: cargo test --all-targets --all-features

      - name: Assert source remained immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C subject rev-parse HEAD)" = "$SUBJECT_SHA"
          test -z "$(git -C subject status --porcelain)"
