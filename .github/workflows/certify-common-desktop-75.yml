name: certify common desktop #75

on:
  pull_request:
    paths:
      - '.github/workflows/certify-common-desktop-75.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-common-desktop-75-20260930'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: 634d77271870ee4cb3ceb9680c33b01bdd67fbf8
      EXPECTED_BASE_SHA: dd10d9a8f107211663530a4e3223f5f1cc513e41
      EXPECTED_LOCK_SHA256: 10aa1591f7069d2c985bfffa176b12e1731f49b3a31322a6d2071a8d3d6aa0b4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact repaired IPC hardening candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-common-desktop-infra
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: common-desktop
          persist-credentials: false
          fetch-depth: 32

      - name: Assert exact review surface and deterministic lock
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          mapfile -t files < <(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD)
          test "${#files[@]}" -eq 2
          printf '%s\n' "${files[@]}" | grep -Fx 'Cargo.lock'
          printf '%s\n' "${files[@]}" | grep -Fx 'ipc/rust/src/lib.rs'
          test "$(sha256sum Cargo.lock | awk '{print $1}')" = "$EXPECTED_LOCK_SHA256"

      - name: Configure private Cargo Git reads
        working-directory: common-desktop
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: gh auth setup-git

      - name: Install pinned Rust
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt,clippy
          rustup default 1.82.0
          rustc --version | grep -F 'rustc 1.82.0'

      - name: Classify inherited rustfmt drift without hiding new drift
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          git show "$EXPECTED_BASE_SHA:ipc/rust/src/lib.rs" > "${RUNNER_TEMP}/base.rs"
          cp ipc/rust/src/lib.rs "${RUNNER_TEMP}/head.rs"
          base_clean=1
          head_clean=1
          rustfmt --edition 2021 --check "${RUNNER_TEMP}/base.rs" || base_clean=0
          rustfmt --edition 2021 --check "${RUNNER_TEMP}/head.rs" || head_clean=0
          if test "$base_clean" -eq 1; then
            test "$head_clean" -eq 1
          fi
          rustfmt --edition 2021 "${RUNNER_TEMP}/head.rs"
          grep -F 'value == "." || value == ".."' "${RUNNER_TEMP}/head.rs"
          grep -F 'fn rejects_dot_path_components_as_identifiers()' "${RUNNER_TEMP}/head.rs"

      - name: Verify lock is already deterministic
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          cp Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"
          cargo generate-lockfile
          cmp -s Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"
          test "$(sha256sum Cargo.lock | awk '{print $1}')" = "$EXPECTED_LOCK_SHA256"

      - name: Locked IPC check
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo check --locked -p ores-common-desktop-ipc --all-targets

      - name: Strict IPC Clippy
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo clippy --locked -p ores-common-desktop-ipc --all-targets -- -D warnings -A clippy::needless-return

      - name: Locked IPC tests
        working-directory: common-desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: cargo test --locked -p ores-common-desktop-ipc --all-targets

      - name: Restore and assert immutable source checkout
        if: always()
        working-directory: common-desktop
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout -- Cargo.lock || true
          git clean -fd -- target
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
