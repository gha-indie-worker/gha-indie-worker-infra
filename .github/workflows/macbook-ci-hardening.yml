name: MacBook CI safety contracts
on:
  pull_request:
    paths:
      - .github/workflows/macbook-ci-hardening.yml
      - scripts/ci/run-local-runner.sh
      - scripts/ci/validate-macbook-ci.mjs
      - scripts/ci/validate-macbook-ci.test.mjs
      - scripts/ci/test-one-job-lifecycle.mjs
      - scripts/ci/verify-native-acceptance.mjs
      - scripts/ci/verify-native-acceptance.test.mjs
      - cloudflare/local-ci-status/config.example.yml
      - config/macbook-ci-repositories.json
      - docs/evidence/macbook-*.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check runner shell syntax
        run: bash -n scripts/ci/run-local-runner.sh
      - name: Exercise negative admission and Cloudflare contracts
        run: node --test scripts/ci/validate-macbook-ci.test.mjs
      - name: Exercise concurrent admission, stale locks and TERM cancellation
        run: node --test scripts/ci/test-one-job-lifecycle.mjs
      - name: Check live-native run readback negative cases
        run: node --test scripts/ci/verify-native-acceptance.test.mjs
      - name: Reject malformed local runner evidence receipts
        run: node scripts/ci/validate-macbook-ci.mjs
  macos-shell:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check system Bash 3.2 compatibility
        run: /bin/bash -n scripts/ci/run-local-runner.sh
      - name: Verify mocked runner admission and cancellation on macOS
        run: node --test scripts/ci/test-one-job-lifecycle.mjs
      - name: Verify native-run acceptance readback negative cases on macOS
        run: node --test scripts/ci/verify-native-acceptance.test.mjs
