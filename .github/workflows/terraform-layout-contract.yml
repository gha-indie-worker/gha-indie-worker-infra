name: Terraform layout contract

on:
  pull_request:
    paths:
      - "modules/**"
      - "environments/**"
      - ".ores-infra.toml"
      - ".gitignore"
      - ".gitmodules"
      - "_apps/gha-monorepo"
      - "TERRAFORM_LAYOUT.md"
      - "docs/terraform-layout-migration.md"
      - "docs/apps-checkout.md"
      - "scripts/check-terraform-layout.sh"
      - "scripts/check-apps-layout.sh"
      - "scripts/sync-apps.sh"
      - "scripts/update-app-pin.sh"
      - ".github/workflows/terraform-layout-contract.yml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
      - ".ores-infra.toml"
      - ".gitignore"
      - ".gitmodules"
      - "_apps/gha-monorepo"
      - "TERRAFORM_LAYOUT.md"
      - "docs/terraform-layout-migration.md"
      - "docs/apps-checkout.md"
      - "scripts/check-terraform-layout.sh"
      - "scripts/check-apps-layout.sh"
      - "scripts/sync-apps.sh"
      - "scripts/update-app-pin.sh"
      - ".github/workflows/terraform-layout-contract.yml"

permissions:
  contents: read

jobs:
  layout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - name: Check 15 Terraform layout invariants
        shell: bash
        run: bash scripts/check-terraform-layout.sh
      - name: Check application checkout boundary
        shell: bash
        run: bash scripts/check-apps-layout.sh
