name: certify ores-websocket #20 lock v2

on:
  pull_request:
    paths:
      - '.github/workflows/certify-ores-websocket-20-lock-v2.yml'

permissions:
  contents: read

jobs:
  certify:
    if: github.head_ref == 'ci/certify-ores-websocket-20-lock-v2-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: faf29e616bb3cafc7f589012c178bec55740dd97
      EXPECTED_BASE_SHA: 3da5602b7c645a886eb23b2b33ab3f6e8296b0b3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact ores-websocket candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-websocket
          ref: ${{ env.EXPECTED_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-websocket
          persist-credentials: false
          fetch-depth: 16
      - name: Assert exact three-file current-main surface
        working-directory: ores-websocket
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git diff --check "$EXPECTED_BASE_SHA"..HEAD
          mapfile -t files < <(git diff --name-only "$EXPECTED_BASE_SHA"..HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | grep -Fx 'src/admission.rs'
          printf '%s\n' "${files[@]}" | grep -Fx 'src/rpc_session.rs'
          printf '%s\n' "${files[@]}" | grep -Fx 'src/axum_support.rs'
      - name: Install declared Rust boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
          rustc --version | grep -F 'rustc 1.88.0'
      - name: Rustfmt
        working-directory: ores-websocket
        run: cargo fmt --all -- --check
      - name: Generate exact lockfile candidate
        working-directory: ores-websocket
        shell: bash
        run: |
          set -Eeuo pipefail
          cp Cargo.lock "${RUNNER_TEMP}/ores-websocket-20-Cargo.lock.before"
          cargo generate-lockfile
          cp Cargo.lock "${RUNNER_TEMP}/ores-websocket-20-Cargo.lock"
          sha256sum Cargo.lock | tee "${RUNNER_TEMP}/ores-websocket-20-Cargo.lock.sha256"
          if ! cmp -s Cargo.lock "${RUNNER_TEMP}/ores-websocket-20-Cargo.lock.before"; then
            echo 'Cargo.lock is stale; exact generated lockfile uploaded as evidence' >&2
            exit 1
          fi
      - name: Upload lockfile candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ores-websocket-20-lock-${{ env.EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/ores-websocket-20-Cargo.lock
            ${{ runner.temp }}/ores-websocket-20-Cargo.lock.sha256
          if-no-files-found: warn
          retention-days: 7
      - name: Strict Clippy all features
        working-directory: ores-websocket
        run: cargo clippy --locked --all-targets --all-features -- -D warnings -A clippy::needless-return
      - name: Locked tests all features
        working-directory: ores-websocket
        run: cargo test --locked --all-targets --all-features
      - name: Assert source checkout stayed immutable
        if: always()
        working-directory: ores-websocket
        shell: bash
        run: |
          git checkout -- Cargo.lock || true
          test -z "$(git status --porcelain)"
