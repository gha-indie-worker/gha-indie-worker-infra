schema_version: ores.compose.v1
project: laptop-ci-secret-isolation
allow_lazy_start: false

services:
  worker-probe:
    name: worker-probe
    runtime: host
    inherit_env: [PATH, PROBE_OUTPUT_DIR]
    secret_env:
      WORKER_APP: WORKER_APP_SENTINEL
      WORKER_WEBHOOK: WORKER_WEBHOOK_SENTINEL
      WORKER_AUTH: WORKER_AUTH_SENTINEL
    command: ["bash", "scripts/laptop-ci-env-probe.sh", "worker", "service", "serve"]
    build:
      - ["bash", "scripts/laptop-ci-env-probe.sh", "worker", "build"]
    working_dir: .
    replicas: 1
    healthcheck:
      command: ["bash", "scripts/laptop-ci-env-probe.sh", "worker", "healthcheck"]
      interval_ms: 100
      timeout_ms: 1000
      retries: 30

  tunnel-probe:
    name: tunnel-probe
    runtime: host
    inherit_env: [PATH, PROBE_OUTPUT_DIR]
    secret_env:
      TUNNEL_TOKEN: TUNNEL_SENTINEL
    command: ["bash", "scripts/laptop-ci-env-probe.sh", "tunnel", "service", "serve"]
    build:
      - ["bash", "scripts/laptop-ci-env-probe.sh", "tunnel", "build"]
    working_dir: .
    replicas: 1
    healthcheck:
      command: ["bash", "scripts/laptop-ci-env-probe.sh", "tunnel", "healthcheck"]
      interval_ms: 100
      timeout_ms: 1000
      retries: 30

  sibling-probe:
    name: sibling-probe
    runtime: host
    inherit_env: [PATH, PROBE_OUTPUT_DIR]
    command: ["bash", "scripts/laptop-ci-env-probe.sh", "sibling", "service", "serve"]
    build:
      - ["bash", "scripts/laptop-ci-env-probe.sh", "sibling", "build"]
    working_dir: .
    replicas: 1
    healthcheck:
      command: ["bash", "scripts/laptop-ci-env-probe.sh", "sibling", "healthcheck"]
      interval_ms: 100
      timeout_ms: 1000
      retries: 30
